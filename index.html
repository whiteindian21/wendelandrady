<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClientPortal OS — The Ultimate Agency Boilerplate</title>
    <meta name="description" content="A production-ready, multi-tenant agency portal boilerplate. Complete with self-healing auth, row-level security, optimistic Kanban task tracking, and zero stale-read cache bugs.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Gumroad Overlay Script -->
    <script src="https://gumroad.com/js/gumroad.js"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050507; /* Near absolute black */
            --bg-elevated: #0a0a0f;
            --border: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            --accent: #6366f1;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg);
            color: var(--text-secondary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Global Mouse Spotlight */
        .spotlight {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(168, 85, 247, 0.06), transparent 40%);
            pointer-events: none;
            z-index: 1;
            transition: background 0.1s;
        }

        /* Animated Mesh Backgrounds */
        .mesh-hero {
            background: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12), transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(168, 85, 247, 0.10), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(16, 185, 129, 0.08), transparent 40%);
        }
        .mesh-pricing {
            background: 
                radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(16, 185, 129, 0.08), transparent 40%);
        }

        /* Noise Texture */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* Grid Background Pattern */
        .grid-bg {
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
        }

        /* Typography & Gradients */
        .text-gradient {
            background: linear-gradient(to bottom right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .text-shine {
            background: linear-gradient(110deg, #e4e4e7 45%, #ffffff 50%, #e4e4e7 55%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 6s linear infinite;
        }
        @keyframes shine { to { background-position: -200% center; } }

        /* Scroll Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Glassmorphism & Premium Borders */
        .glass {
            background: rgba(10, 10, 15, 0.5);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.03), 0 20px 40px -20px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }
        .glass-hover:hover {
            border-color: var(--border-hover);
        }

        /* Mouse Tracking Glow for Cards */
        .card-glow {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }
        .card-glow::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: radial-gradient(300px circle at var(--mx) var(--my), rgba(168, 85, 247, 0.6), transparent 40%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2;
            pointer-events: none;
        }
        .card-glow:hover::before { opacity: 1; }

        /* Premium Button Shine */
        .btn-premium { position: relative; overflow: hidden; isolation: isolate; }
        .btn-premium::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            transition: 0.7s;
            z-index: 1;
        }
        .btn-premium:hover::after { left: 150%; }

        /* Rotating Conic Gradient */
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        .conic-border { position: relative; z-index: 10; }
        .conic-border::before {
            content: ''; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
            background: conic-gradient(from var(--angle), transparent 0%, #6366f1 20%, #3b82f6 40%, transparent 60%, #10b981 80%, transparent 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: rotate-conic 6s linear infinite;
            z-index: -1;
        }
        @keyframes rotate-conic { to { --angle: 360deg; } }

        /* Chat Typing Animation */
        .typing-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        /* Custom Scrollbar */
        .pretty-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        .pretty-scroll::-webkit-scrollbar-track { background: transparent; }
        .pretty-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .pretty-scroll::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Kanban Card Slide Animation */
        @keyframes slide-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .task-card { animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-300 antialiased selection:bg-indigo-500/30">

    <div class="noise-overlay"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GUMROAD_URL = "https://andradyy.gumroad.com/l/clientportal";
        const DEMO_URL = "https://andrady.co";

        // --- Inline SVG Icons ---
        const Icon = ({ path, className = "h-5 w-5", stroke = true }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke={stroke ? "currentColor" : "none"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
        );
        
        const ICONS = {
            rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-3.16-.1z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
            shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
            check: '<polyline points="20 6 9 17 4 12"/>',
            x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
            arrowRight: '<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
            chevronDown: '<polyline points="6 9 12 15 18 9"/>',
            chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
            chevronRight: '<polyline points="9 18 15 12 9 6"/>',
            lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
            zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
            palette: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
            package: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
            folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
            chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            menu: '<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>',
            terminal: '<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>',
            code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
            database: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>',
            sparkle: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
            star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
        };

        // --- Global Mouse Tracking Hook ---
        const useMousePosition = () => {
            const [pos, setPos] = useState({ x: 0, y: 0 });
            useEffect(() => {
                const handler = (e) => setPos({ x: e.clientX, y: e.clientY });
                window.addEventListener('mousemove', handler);
                return () => window.removeEventListener('mousemove', handler);
            }, []);
            return pos;
        };

        // --- Scroll Reveal Hook ---
        const useReveal = (delay = 0) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setTimeout(() => entry.target.classList.add('visible'), delay);
                        }
                    },
                    { threshold: 0.1 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [delay]);
            return ref;
        };

        // --- Card Component with 3D Tilt ---
        const TiltCard = ({ children, className = "", glow = true }) => {
            const ref = useRef(null);
            const handleMouseMove = (e) => {
                if (!ref.current) return;
                const rect = ref.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const cx = rect.width / 2;
                const cy = rect.height / 2;
                const rx = (y - cy) / 25;
                const ry = (cx - x) / 25;
                
                ref.current.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale(1.02)`;
                ref.current.style.setProperty('--mx', `${x}px`);
                ref.current.style.setProperty('--my', `${y}px`);
            };
            const handleMouseLeave = () => {
                if (!ref.current) return;
                ref.current.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
            };
            return (
                <div 
                    ref={ref} 
                    onMouseMove={handleMouseMove} 
                    onMouseLeave={handleMouseLeave}
                    className={`transition-transform duration-300 ease-out ${glow ? 'card-glow' : ''} ${className}`}
                    style={{ transformStyle: 'preserve-3d' }}
                >
                    {children}
                </div>
            );
        };

        // --- Interactive Live Demo Component ---
        const LiveDemo = () => {
            const [activeTab, setActiveTab] = useState('kanban');
            const tabs = [
                { id: 'kanban', label: 'Kanban', icon: ICONS.package },
                { id: 'files', label: 'Files', icon: ICONS.folder },
                { id: 'chat', label: 'Chat', icon: ICONS.chat },
            ];

            return (
                // Applied purple glow border and gradient background to make it pop
                <div className="mt-16 max-w-6xl mx-auto rounded-2xl border border-zinc-800 bg-gradient-to-b from-zinc-900/50 to-zinc-950 shadow-2xl shadow-purple-500/10 overflow-hidden backdrop-blur-xl relative">
                    <div className="flex items-center gap-2 border-b border-zinc-800 bg-zinc-950/80 px-4 py-3">
                        <div className="h-3 w-3 rounded-full bg-red-500/80"></div>
                        <div className="h-3 w-3 rounded-full bg-yellow-500/80"></div>
                        <div className="h-3 w-3 rounded-full bg-green-500/80"></div>
                        <div className="ml-4 text-xs text-zinc-500 hidden sm:block font-mono">app.youragency.com/projects/1</div>
                        <div className="ml-auto text-xs text-emerald-400 font-medium flex items-center gap-1.5">
                            <span className="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Demo
                        </div>
                    </div>
                    
                    <div className="flex border-b border-zinc-800 bg-zinc-950/50">
                        {tabs.map(tab => (
                            <button 
                                key={tab.id} 
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-6 py-3 text-sm font-medium transition-colors relative flex items-center gap-2 ${activeTab === tab.id ? 'text-white' : 'text-zinc-500 hover:text-zinc-300'}`}
                            >
                                <Icon path={tab.icon} className="h-4 w-4" />
                                {tab.label}
                                {activeTab === tab.id && <div className="absolute bottom-0 left-0 right-0 h-[2px] bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.7)]"></div>}
                            </button>
                        ))}
                    </div>

                    <div className="p-6 bg-zinc-950/50 min-h-[500px]">
                        {activeTab === 'kanban' && <KanbanTab />}
                        {activeTab === 'files' && <FilesTab />}
                        {activeTab === 'chat' && <ChatTab />}
                    </div>
                </div>
            );
        };

        // --- Tab 1: Kanban ---
        const KanbanTab = () => {
            const initialTasks = [
                { id: 1, title: 'Design Homepage Hero', priority: 'high', status: 'done' },
                { id: 2, title: 'Supabase RLS Policies', priority: 'high', status: 'in_review' },
                { id: 3, title: 'API Route Handlers', priority: 'medium', status: 'in_progress' },
                { id: 4, title: 'Client Invite Emails', priority: 'medium', status: 'in_progress' },
                { id: 5, title: 'Optimistic Kanban UI', priority: 'low', status: 'backlog' },
                { id: 6, title: 'Deploy to Vercel', priority: 'high', status: 'backlog' },
            ];
            const [tasks, setTasks] = useState(initialTasks);

            const columns = [
                { id: 'backlog', title: 'Backlog', dot: 'bg-zinc-500' },
                { id: 'in_progress', title: 'In Progress', dot: 'bg-blue-500' },
                { id: 'in_review', title: 'In Review', dot: 'bg-yellow-500' },
                { id: 'done', title: 'Done', dot: 'bg-emerald-500' },
            ];

            const moveTask = (id, dir) => {
                setTasks(prev => prev.map(t => {
                    if (t.id === id) {
                        const currentIdx = columns.findIndex(c => c.id === t.status);
                        const nextIdx = Math.min(Math.max(currentIdx + dir, 0), columns.length - 1);
                        return { ...t, status: columns[nextIdx].id, moved: true };
                    }
                    return t;
                }));
            };

            const priorityStyles = {
                high: 'bg-red-500/10 text-red-400 border-red-500/20',
                medium: 'bg-blue-500/10 text-blue-400 border-blue-500/20',
                low: 'bg-zinc-500/10 text-zinc-400 border-zinc-500/20',
            };

            return (
                <div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        {columns.map(col => {
                            const colTasks = tasks.filter(t => t.status === col.id);
                            return (
                                <div key={col.id} className="bg-zinc-900/40 border border-zinc-800 rounded-xl p-3 min-h-[300px]">
                                    <div className="flex items-center gap-2 mb-4 px-1">
                                        <span className={`h-2 w-2 rounded-full ${col.dot}`}></span>
                                        <span className="text-xs font-medium text-zinc-300">{col.title}</span>
                                        <span className="ml-auto text-xs text-zinc-600">{colTasks.length}</span>
                                    </div>
                                    <div className="space-y-2">
                                        {colTasks.map(task => (
                                            <div key={task.id} className="task-card bg-zinc-900 border border-zinc-800 rounded-lg p-3 group hover:border-purple-500/30 transition-all duration-300">
                                                <div className="flex justify-between items-start mb-2">
                                                    <p className="text-sm text-zinc-100 break-words">{task.title}</p>
                                                    <span className={`text-[9px] font-medium px-1.5 py-0.5 rounded border ${priorityStyles[task.priority]}`}>
                                                        {task.priority}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between items-center mt-3">
                                                    <span className="text-[10px] text-zinc-600 font-mono">CP-OS</span>
                                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                                        <button onClick={() => moveTask(task.id, -1)} className="h-6 w-6 flex items-center justify-center border border-zinc-800 rounded hover:bg-white/10 text-zinc-400 hover:text-white transition">
                                                            <Icon path={ICONS.chevronLeft} className="h-3 w-3" />
                                                        </button>
                                                        <button onClick={() => moveTask(task.id, 1)} className="h-6 w-6 flex items-center justify-center border border-zinc-800 rounded hover:bg-white/10 text-zinc-400 hover:text-white transition">
                                                            <Icon path={ICONS.chevronRight} className="h-3 w-3" />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        {colTasks.length === 0 && (
                                            <div className="text-center py-8 text-zinc-700 text-xs">No tasks</div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <p className="text-center text-xs text-zinc-400 mt-6">
                        Hover over a task card and click the arrows. State updates instantly with React 19 Optimistic UI.
                    </p>
                </div>
            );
        };

        // --- Tab 2: Files ---
        const FilesTab = () => {
            const [isDragging, setIsDragging] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const files = [
                { name: 'Brand_Guidelines.pdf', size: '2.4 MB', date: 'Oct 24' },
                { name: 'Homepage_Design.fig', size: '8.1 MB', date: 'Oct 22' },
                { name: 'API_Schema_v2.json', size: '124 KB', date: 'Oct 18' },
            ];

            useEffect(() => {
                if (isDragging) {
                    setUploadProgress(0);
                    const interval = setInterval(() => {
                        setUploadProgress(prev => Math.min(prev + 10, 100));
                    }, 100);
                    return () => clearInterval(interval);
                } else {
                    setUploadProgress(0);
                }
            }, [isDragging]);

            return (
                <div className="max-w-2xl mx-auto">
                    <div 
                        className={`border-2 border-dashed rounded-xl p-8 text-center transition-all duration-300 ${isDragging ? 'border-purple-500 scale-[1.02] bg-purple-500/5' : 'border-zinc-700 hover:border-zinc-600'}`}
                        onMouseEnter={() => setIsDragging(true)}
                        onMouseLeave={() => setIsDragging(false)}
                    >
                        <div className={`h-12 w-12 mx-auto rounded-full border flex items-center justify-center mb-4 transition-colors ${isDragging ? 'bg-purple-500/20 border-purple-500/30' : 'bg-white/5 border-white/10'}`}>
                            <Icon path={ICONS.folder} className={`h-6 w-6 transition-colors ${isDragging ? 'text-purple-400' : 'text-zinc-400'}`} />
                        </div>
                        <p className="text-white font-medium">{isDragging && uploadProgress < 100 ? `Uploading... ${uploadProgress}%` : 'Drag & drop files here'}</p>
                        <p className="text-xs text-zinc-500 mt-1">Secure bucket storage with RLS policies enabled</p>
                        {isDragging && (
                            <div className="mt-4 w-full bg-white/5 rounded-full h-1.5 overflow-hidden">

        const ChatTab = () => {
            const [messages, setMessages] = useState([{ id: 1, sender: 'client', text: 'Hey! Just reviewed the new Kanban UI. Looks amazing!' }]);
            const [typing, setTyping] = useState(false);
            const [currentText, setCurrentText] = useState("");
            const scrollRef = useRef(null);

            const script = [
                { sender: 'agency', text: 'Glad you like it! We used the new React 19 useOptimistic hook for instant updates.' },
                { sender: 'client', text: 'Perfect. When can we deploy to production?' },
                { sender: 'agency', text: 'Right now. Just merged to main, waiting on Vercel build.' },
                { sender: 'client', text: 'Awesome. Send over the invoice when you get a chance.' },
                { sender: 'agency', text: 'Sent! Thanks for the smooth collab.' }
            ];

            useEffect(() => {
                let stepIndex = 0;
                let charIndex = 0;
                let isMounted = true;

                const startTyping = () => {
                    if (!isMounted) return;
                    if (stepIndex >= script.length) {
                        setTimeout(() => {
                            if (!isMounted) return;
                            setMessages([{ id: 1, sender: 'client', text: 'Hey! Just reviewed the new Kanban UI. Looks amazing!' }]);
                            stepIndex = 0;
                            startTyping();
                        }, 4000);
                        return;
                    }

                    const currentScript = script[stepIndex];
                    setTyping(true);
                    
                    setTimeout(() => {
                        if (!isMounted) return;
                        setTyping(false);
                        const typeChar = () => {
                            if (!isMounted) return;
                            if (charIndex <= currentScript.text.length) {
                                setCurrentText(currentScript.text.substring(0, charIndex));
                                charIndex++;
                                setTimeout(typeChar, 30);
                            } else {
                                setMessages(prev => [...prev, { id: Date.now(), sender: currentScript.sender, text: currentScript.text }]);
                                setCurrentText("");
                                charIndex = 0;
                                stepIndex++;
                                setTimeout(startTyping, 1500);
                            }
                        };
                        typeChar();
                    }, 1500);
                };

                const timer = setTimeout(startTyping, 2000);
                return () => { isMounted = false; clearTimeout(timer); };
            }, []);

            useEffect(() => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                }
            }, [messages, currentText]);

                                </div>

                                    <p className="text-zinc-400 text-sm mt-1">ClientPortal OS</p>

                                <div className="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-medium">
                                    Best Value
                                </div>
                            </div>
                            <div className="flex items-baseline gap-2 mb-8">
                                <span className="text-6xl font-extrabold text-white tracking-tighter">$249</span>
                                <span className="text-zinc-400 text-sm">One-time</span>
                            </div>
                            <ul className="space-y-4 mb-8">
                                {includes.map(item => (
                                    <li key={item} className="flex items-start gap-3 text-sm text-zinc-300">
                                        <div className="h-5 w-5 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center flex-shrink-0 mt-0.5">
                                            <Icon path={ICONS.check} className="h-3 w-3 text-emerald-400" />
                                        </div>
                                        <span>{item}</span>
                                    </li>
                                ))}
                            </ul>
                            <a href={GUMROAD_URL} target="_blank" rel="noreferrer" className="gumroad-button btn-premium block w-full text-center py-3 rounded-xl bg-white text-black font-bold hover:bg-zinc-200 transition-all shadow-lg shadow-black/20 relative overflow-hidden hover:scale-105 hover:shadow-[0_0_20px_rgba(168,85,247,0.4)]">
                                <span className="relative z-10">Get Instant Access</span>
                            </a>
                            <p className="text-center text-xs text-zinc-500 mt-4">Secure checkout via Gumroad</p>
                        </div>
                    </div>
                </section>
            );
        };

        const FAQ = () => {
            const [open, setOpen] = useState(null);
            const ref = useReveal();
            
            const faqs = [
                { q: "What stack does ClientPortal OS use?", a: "Next.js 15 (App Router), React 19, Supabase (Auth, Postgres, Storage), Tailwind CSS, and TypeScript." },
                { q: "Can I use this for multiple agency clients?", a: "Yes! The license covers unlimited commercial agency projects and client instances." },
                { q: "How long does setup take?", a: "Under 10 minutes. You just run schema.sql in your Supabase project, set 3 environment variables, and deploy to Vercel." },
                { q: "Do I need a paid Supabase plan?", a: "No, it runs seamlessly on Supabase's generous free tier." }
            ];

            return (
                <section id="faq" className="max-w-3xl mx-auto px-6 py-32 border-t border-zinc-800">
                    <div ref={ref} className="reveal text-center mb-16">
                        {/* Updated Subheader Color */}
                        <p className="text-sm font-semibold text-purple-400 mb-2 tracking-widest uppercase">FAQ</p>
                        <h2 className="text-4xl md:text-5xl font-extrabold text-white tracking-tight">Frequently Asked Questions</h2>
                    </div>
                    <div className="space-y-4">
                        {faqs.map((faq, i) => (
                            <div key={i} className="glass glass-hover rounded-2xl overflow-hidden">
                                <button 
                                    className="w-full flex items-center justify-between p-6 text-left"
                                    onClick={() => setOpen(open === i ? null : i)}
                                >
                                    <span className="font-medium text-white">{faq.q}</span>
                                    <div className={`h-8 w-8 rounded-full bg-white/5 border border-zinc-800 flex items-center justify-center transition-transform duration-300 ${open === i ? 'rotate-180 bg-purple-500/20 border-purple-500/30' : ''}`}>
                                        <Icon path={ICONS.chevronDown} className="h-4 w-4 text-zinc-400" />
                                    </div>
                                </button>
                                <div className={`grid transition-all duration-300 ease-in-out ${open === i ? 'grid-rows-[1fr] opacity-100' : 'grid-rows-[0fr] opacity-0'}`}>
                                    <div className="overflow-hidden">
                                        <p className="px-6 pb-6 text-zinc-400 text-sm leading-relaxed">{faq.a}</p>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="border-t border-zinc-800 bg-black">
                <div className="max-w-7xl mx-auto px-6 py-12 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div className="flex items-center gap-2">
                        <div className="h-6 w-6 bg-purple-600 rounded-md flex items-center justify-center font-bold text-xs text-white">C</div>
                        <span className="font-semibold text-white">ClientPortal OS</span>
                    </div>
                    <p className="text-xs text-zinc-500">© {new Date().getFullYear()} ClientPortal OS. Built by Andrady.</p>
                    <div className="flex items-center gap-6 text-sm text-zinc-400">
                        <a href={DEMO_URL} target="_blank" rel="noreferrer" className="hover:text-white transition flex items-center gap-2">
                            <Icon path={ICONS.rocket} className="h-4 w-4" /> Live Demo
                        </a>
                        <a href="mailto:wendelandrady8@gmail.com" className="hover:text-white transition flex items-center gap-2">
                            <Icon path={ICONS.chat} className="h-4 w-4" /> Support
                        </a>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const mousePos = useMousePosition();
            
            useEffect(() => {
                document.documentElement.style.setProperty('--mouse-x', `${mousePos.x}px`);
                document.documentElement.style.setProperty('--mouse-y', `${mousePos.y}px`);
            }, [mousePos]);

            return (
                <div className="min-h-screen relative">
                    <div className="spotlight"></div>
                    <Nav />
                    <Hero />
                    <MetricsBar />
                    <BentoFeatures />
                    
                    <section id="demo" className="max-w-7xl mx-auto px-6 py-32 border-t border-zinc-800">
                        <div className="text-center mb-16">
                            {/* Updated Subheader Color */}
                            <p className="text-sm font-semibold text-purple-400 mb-2 tracking-widest uppercase">Optimistic UI</p>
                            <h2 className="text-4xl md:text-5xl font-extrabold text-white tracking-tight">Experience the Workspace.</h2>
                            <p className="text-zinc-400 mt-4 max-w-2xl mx-auto">No page reloads. No loading spinners. Just instant state updates powered by React 19 Server Actions.</p>
                        </div>
                        <LiveDemo />
                    </section>

                    <CodeSnippet />
                    
                    {/* Founder's Note */}
                    <FoundersNote /> 
                    
                    <Pricing />
                    <FAQ />
                    <Footer />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
