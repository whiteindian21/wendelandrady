<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wendel Andrady — Business Infrastructure for 7-Figure Founders</title>
  <meta name="description" content="I build automated business infrastructure that replaces $60K/year in manual work — delivered in 7 days. Three systems. One outcome: you stop being the bottleneck.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{colors:{
      ink:'#0C0C0E','ink-card':'#111114','ink-border':'#1E1E24',
      'ink-muted':'#5A5A6E','ink-subtle':'#38383F',
      lime:'#D4F544','lime-dim':'#AECB32',amber:'#F5A623',rose:'#FF6B6B',
    },fontFamily:{
      display:['"Instrument Serif"','serif'],
      sans:['"Syne"','sans-serif'],
      mono:['"DM Mono"','monospace'],
    }}}}
  </script>
  <style>
    :root{
      --lime:#D4F544;--lime-dim:#AECB32;--ink:#0C0C0E;--ink-card:#111114;
      --ink-border:#1E1E24;--ink-muted:#5A5A6E;--ink-subtle:#38383F;
    }
    *,*::before,*::after{box-sizing:border-box;cursor:none;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--ink);color:#E8E8F0;font-family:'Syne',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:2px}
    ::-webkit-scrollbar-track{background:var(--ink)}
    ::-webkit-scrollbar-thumb{background:var(--lime);border-radius:99px}
    ::selection{background:rgba(212,245,68,.18);color:#fff}
    .grid-tex{background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:48px 48px}
    .glow-lime{box-shadow:0 0 60px rgba(212,245,68,.1),0 0 120px rgba(212,245,68,.04)}
    .glow-lime-btn{box-shadow:0 0 30px rgba(212,245,68,.25),0 4px 24px rgba(212,245,68,.1)}
    .display{font-family:'Instrument Serif',serif;line-height:1;letter-spacing:-.02em}
    .mono-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-muted)}
    .card{background:var(--ink-card);border:1px solid var(--ink-border);border-radius:20px;padding:32px;transition:border-color .4s,box-shadow .4s}
    .card:hover{border-color:rgba(212,245,68,.18);box-shadow:0 0 50px rgba(212,245,68,.05)}
    .card-core{background:var(--ink-card);border:2px solid rgba(212,245,68,.3);border-radius:20px;padding:36px;transition:border-color .4s,box-shadow .4s;box-shadow:0 0 60px rgba(212,245,68,.06);position:relative}
    .card-core:hover{border-color:rgba(212,245,68,.5);box-shadow:0 0 80px rgba(212,245,68,.1)}
    .pill{display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(212,245,68,.08);border:1px solid rgba(212,245,68,.14);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)}
    .pill-amber{display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.14);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
    .field{width:100%;padding:15px 20px;background:var(--ink-card);border:1px solid var(--ink-border);border-radius:14px;color:#E8E8F0;font-family:'Syne',sans-serif;font-size:15px;outline:none;transition:border-color .3s,box-shadow .3s}
    .field:focus{border-color:rgba(212,245,68,.4);box-shadow:0 0 0 2px rgba(212,245,68,.07)}
    .field::placeholder{color:var(--ink-muted)}
    .btn-lime{background:var(--lime);color:var(--ink);font-family:'Syne',sans-serif;font-weight:700;padding:16px 36px;border-radius:999px;font-size:15px;letter-spacing:.01em;border:none;transition:background .25s,box-shadow .25s;box-shadow:0 0 30px rgba(212,245,68,.2)}
    .btn-lime:hover{background:var(--lime-dim);box-shadow:0 0 50px rgba(212,245,68,.4)}
    .btn-ghost{background:transparent;color:#E8E8F0;font-family:'Syne',sans-serif;font-weight:500;padding:16px 36px;border-radius:999px;font-size:15px;border:1px solid var(--ink-border);transition:border-color .25s,color .25s}
    .btn-ghost:hover{border-color:rgba(212,245,68,.3);color:var(--lime)}
    .btn-outline-lime{background:transparent;color:var(--lime);font-family:'Syne',sans-serif;font-weight:600;padding:14px 32px;border-radius:999px;font-size:14px;border:1px solid rgba(212,245,68,.3);transition:background .25s,border-color .25s}
    .btn-outline-lime:hover{background:rgba(212,245,68,.06);border-color:rgba(212,245,68,.5)}
    .chk{width:22px;height:22px;border-radius:50%;background:rgba(212,245,68,.09);border:1px solid rgba(212,245,68,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .xmk{width:22px;height:22px;border-radius:50%;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .num-xl{font-family:'Instrument Serif',serif;font-size:clamp(48px,7vw,80px);line-height:1;color:var(--lime)}
    .marquee-track{display:inline-flex;animation:mq 32s linear infinite;white-space:nowrap}
    .marquee-track-rev{animation-direction:reverse;animation-duration:38s}
    @keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .step-ghost{font-family:'Instrument Serif',serif;font-size:120px;line-height:1;color:rgba(212,245,68,.06);position:absolute;top:-20px;right:20px;pointer-events:none;user-select:none}
    .comparison-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;align-items:center;padding:10px 16px;border-bottom:1px solid #1E1E24;font-size:13px}
    .comparison-row:last-child{border-bottom:none}
    .comparison-header{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#5A5A6E}
    .leak-bar{height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(212,245,68,.6),rgba(212,245,68,.08));position:relative;overflow:hidden}
    .leak-bar::after{content:'';position:absolute;top:0;left:0;height:100%;width:30%;background:rgba(255,107,107,.6);border-radius:2px}
    @keyframes drip{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(4px)}}
    .drip{animation:drip 2s ease-in-out infinite}
    @media(hover:none){*{cursor:auto!important}.cc,.cr{display:none!important}a,button,input,textarea,select{cursor:auto!important}}
    @media(max-width:640px){
      .sm-full{width:100%!important}
      .comparison-row{grid-template-columns:1.5fr 1fr 1fr 1fr;font-size:11px;padding:8px 10px}
    }
    .status-message{font-family:'DM Mono',monospace;font-size:13px;padding:12px 16px;border-radius:99px;text-align:center;margin-top:16px;backdrop-filter:blur(4px);}
    .roi-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.18);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#F5A623;margin-bottom:12px}
  </style>
</head>
<body class="grid-tex">
<div id="root"></div>
<script type="text/babel">
const{useState,useRef,useEffect}=React;
const{motion,AnimatePresence}=window.Motion;

/* ══ CURSOR ══ */
function Cursor(){
  const dot=useRef(null),ring=useRef(null);
  useEffect(()=>{
    let mx=0,my=0,rx=0,ry=0;
    const mv=e=>{
      mx=e.clientX;my=e.clientY;
      if(dot.current)dot.current.style.transform=`translate(${mx-4}px,${my-4}px)`;
      const t=e.target.closest('a,button,input,textarea,select,[data-h]');
      if(ring.current){
        const s=t?'54px':'38px',o=t?-27:-19;
        ring.current.style.width=s;ring.current.style.height=s;
        ring.current.style.left=o+'px';ring.current.style.top=o+'px';
        ring.current.style.borderColor=t?'#D4F544':'rgba(212,245,68,.28)';
        ring.current.style.opacity=t?'1':'0.6'}
    };
    const lp=()=>{rx+=(mx-rx)*.12;ry+=(my-ry)*.12;
      if(ring.current)ring.current.style.transform=`translate(${rx}px,${ry}px)`;
      requestAnimationFrame(lp)};
    window.addEventListener('mousemove',mv);lp();
    return()=>window.removeEventListener('mousemove',mv)
  },[]);
  return<>
    <div ref={dot} className="cc fixed w-2 h-2 rounded-full pointer-events-none z-[10000]" style={{background:'#D4F544',mixBlendMode:'difference'}}/>
    <div ref={ring} className="cr fixed w-[38px] h-[38px] border rounded-full pointer-events-none z-[10000]" style={{borderColor:'rgba(212,245,68,.28)',transition:'width .2s,height .2s,left .2s,top .2s,border-color .2s,opacity .2s'}}/>
  </>;
}

/* ══ PROGRESS BAR ══ */
function ProgressBar(){
  const[p,setP]=useState(0);
  useEffect(()=>{
    const h=()=>{const t=document.documentElement.scrollHeight-window.innerHeight;setP(window.scrollY/t*100)};
    window.addEventListener('scroll',h);return()=>window.removeEventListener('scroll',h)
  },[]);
  return<div className="fixed top-0 left-0 h-[2px] z-[9998]" style={{width:`${p}%`,background:'#D4F544'}}/>;
}

/* ══ REVEAL ══ */
function R({children,d=0,className='',y=28}){
  return<motion.div initial={{opacity:0,y}} whileInView={{opacity:1,y:0}}
    viewport={{once:true,margin:'-40px'}} transition={{duration:.68,delay:d,ease:[.215,.61,.355,1]}}
    className={className}>{children}</motion.div>;
}

/* ══ THREE JS BG ══ */
function ThreeBG(){
  const m=useRef(null);
  useEffect(()=>{
    const mob=window.innerWidth<768,W=window.innerWidth,H=window.innerHeight;
    const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,W/H,.1,100);cam.position.z=5;
    const ren=new THREE.WebGLRenderer({alpha:true,antialias:true});
    ren.setSize(W,H);ren.setPixelRatio(Math.min(window.devicePixelRatio,mob?1.5:2));
    m.current.appendChild(ren.domElement);
    const geo1=new THREE.IcosahedronGeometry(2.1,1),mat1=new THREE.MeshBasicMaterial({color:0xD4F544,wireframe:true,transparent:true,opacity:.04});
    const geo2=new THREE.IcosahedronGeometry(1.25,1),mat2=new THREE.MeshBasicMaterial({color:0xF5A623,wireframe:true,transparent:true,opacity:.04});
    const o1=new THREE.Mesh(geo1,mat1),o2=new THREE.Mesh(geo2,mat2);
    s.add(o1,o2);
    const mkT=c=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');
      const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(.4,c.replace(',1)',',0.35)'));g.addColorStop(1,c.replace(',1)',',0)'));
      x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv)};
    const mkP=(n,col,sz,op,r1,r2)=>{
      const pos=new Float32Array(n*3);
      for(let i=0;i<n;i++){const r=r1+Math.random()*r2,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
        pos[i*3]=r*Math.sin(p)*Math.cos(t);pos[i*3+1]=r*Math.sin(p)*Math.sin(t);pos[i*3+2]=r*Math.cos(p)}
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      return new THREE.Points(g,new THREE.PointsMaterial({map:mkT(col),size:sz,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}))};
    const p1=mkP(mob?150:600,'rgba(212,245,68,1)',mob?.05:.03,.4,2.5,5);
    const p2=mkP(mob?40:160,'rgba(245,166,35,1)',mob?.04:.025,.25,3,4);
    s.add(p1,p2);
    let mx=0,my=0;const onM=e=>{mx=(e.clientX/W)*2-1;my=-(e.clientY/H)*2+1};
    window.addEventListener('mousemove',onM);
    const tick=()=>{requestAnimationFrame(tick);const t=performance.now()*.001;
      o1.rotation.x=t*.035+my*.18;o1.rotation.y=t*.055+mx*.18;
      o2.rotation.x=-t*.028+my*.1;o2.rotation.y=-t*.04+mx*.1;
      p1.rotation.y=t*.009;p2.rotation.y=-t*.006;ren.render(s,cam)};
    tick();
    const onR=()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();ren.setSize(window.innerWidth,window.innerHeight)};
    window.addEventListener('resize',onR);
    return()=>{try{window.removeEventListener('resize',onR);window.removeEventListener('mousemove',onM);if(m.current)m.current.removeChild(ren.domElement)}catch(e){}};
  },[]);
  return<div ref={m} className="fixed inset-0 -z-10"/>;
}

/* ══ PRELOADER ══ */
function Preloader({done}){
  const[c,setC]=useState(0);
  useEffect(()=>{
    const iv=setInterval(()=>setC(p=>{if(p>=100){clearInterval(iv);setTimeout(done,350);return 100}return p+2}),18);
    return()=>clearInterval(iv)
  },[]);
  return<motion.div exit={{y:'-100%'}} transition={{duration:.75,ease:[.76,0,.24,1]}}
    className="fixed inset-0 z-[9999] flex flex-col items-center justify-center" style={{background:'#0C0C0E'}}>
    <div style={{fontFamily:'Instrument Serif',fontSize:'clamp(80px,14vw,140px)',color:'#D4F544',lineHeight:1}}>{c}</div>
    <div className="mt-5 w-36 h-[1px] overflow-hidden" style={{background:'#1E1E24'}}>
      <motion.div className="h-full" initial={{width:'0%'}} animate={{width:`${c}%`}} style={{background:'#D4F544'}}/></div>
    <div style={{fontFamily:'DM Mono',fontSize:'11px',color:'#2a2a30',letterSpacing:'.25em',marginTop:'14px'}}>INITIALISING</div>
  </motion.div>;
}

/* ══ NAVBAR ══ */
function Nav({refs}){
  const[sc,setSc]=useState(false),[mo,setMo]=useState(false);
  useEffect(()=>{const h=()=>setSc(window.scrollY>50);window.addEventListener('scroll',h);return()=>window.removeEventListener('scroll',h)},[]);
  const go=r=>{r.current.scrollIntoView({behavior:'smooth'});setMo(false)};
  const links=[{l:'The Problem',r:refs.prob},{l:'Systems',r:refs.svc},{l:'Proof',r:refs.work},{l:'Process',r:refs.proc},{l:'Get Started',r:refs.ctRef}];
  return<motion.nav initial={{opacity:0,y:-20}} animate={{opacity:1,y:0}} transition={{duration:.6,delay:1.5}}
    className="fixed w-full z-50"
    style={{background:sc?'rgba(12,12,14,.88)':'transparent',backdropFilter:sc?'blur(22px)':'none',borderBottom:sc?'1px solid #1E1E24':'none',padding:sc?'12px 0':'22px 0',transition:'all .4s'}}>
    <div className="max-w-6xl mx-auto px-6 flex items-center justify-between">
      <button onClick={()=>refs.hero.current.scrollIntoView({behavior:'smooth'})} data-h
        style={{fontFamily:'Syne',fontWeight:800,fontSize:'18px',letterSpacing:'-.01em',color:'#E8E8F0'}}>
        Wendel<span style={{color:'#D4F544'}}>.</span>
      </button>
      <div className="hidden md:flex items-center gap-1">
        {links.map(l=><button key={l.l} onClick={()=>go(l.r)} data-h
          className="px-4 py-2 text-sm font-sans transition-colors duration-300"
          style={{color:'#5A5A6E'}}
          onMouseEnter={e=>e.currentTarget.style.color='#D4F544'}
          onMouseLeave={e=>e.currentTarget.style.color='#5A5A6E'}>{l.l}</button>)}
        <button onClick={()=>go(refs.ctRef)} data-h className="btn-lime ml-3 py-2.5 px-6 text-sm">Build My System →</button>
      </div>
      <button onClick={()=>setMo(!mo)} data-h className="md:hidden flex flex-col items-center justify-center gap-1.5 w-10 h-10">
        <motion.span animate={mo?{rotate:45,y:6}:{rotate:0,y:0}} className="w-5 h-[1.5px] block origin-center" style={{background:'#D4F544'}}/>
        <motion.span animate={mo?{opacity:0}:{opacity:1}} className="w-5 h-[1.5px] block" style={{background:'#D4F544'}}/>
        <motion.span animate={mo?{rotate:-45,y:-6}:{rotate:0,y:0}} className="w-5 h-[1.5px] block origin-center" style={{background:'#D4F544'}}/>
      </button>
    </div>
    <AnimatePresence>{mo&&
      <motion.div initial={{opacity:0,height:0}} animate={{opacity:1,height:'auto'}} exit={{opacity:0,height:0}} transition={{duration:.28}}
        className="md:hidden overflow-hidden" style={{background:'rgba(12,12,14,.96)',backdropFilter:'blur(20px)',borderTop:'1px solid #1E1E24'}}>
        <div className="px-6 py-5 space-y-1">
          {links.map((l,i)=><motion.button key={l.l} initial={{opacity:0,x:-14}} animate={{opacity:1,x:0}} transition={{delay:i*.04}}
            onClick={()=>go(l.r)} className="block w-full text-left py-3 text-lg" style={{color:'#5A5A6E'}}>{l.l}</motion.button>)}
          <button onClick={()=>go(refs.ctRef)} className="btn-lime w-full mt-4 text-center block">Build My System →</button>
        </div>
      </motion.div>}
    </AnimatePresence>
  </motion.nav>;
}

/* ══ HERO ══ */
function Hero({refs}){
  const scrollTo=r=>refs[r].current.scrollIntoView({behavior:'smooth'});
  return<section ref={refs.hero} className="relative min-h-screen flex items-center justify-center overflow-hidden" style={{paddingTop:'80px'}}>
    <ThreeBG/>
    <div className="absolute inset-0 pointer-events-none" style={{background:'linear-gradient(to bottom,#0C0C0E 0%,transparent 15%,transparent 82%,#0C0C0E 100%)'}}/>
    <div className="relative z-10 text-center px-6 max-w-5xl w-full">
      <R d={1.7}><div className="pill mx-auto mb-7 inline-block">Business Infrastructure Engineering</div></R>
      <div className="overflow-hidden mb-4">
        <motion.h1 initial={{y:110,opacity:0}} animate={{y:0,opacity:1}} transition={{duration:.85,delay:1.9,ease:[.215,.61,.355,1]}}
          className="display" style={{fontSize:'clamp(46px,9.5vw,110px)',color:'#E8E8F0',lineHeight:'1.02'}}>
          Your business is growing.<br/><em style={{color:'#D4F544',fontStyle:'italic'}}>Your systems aren't.</em>
        </motion.h1>
      </div>
      <R d={2.3}>
        <p className="text-base md:text-lg max-w-2xl mx-auto leading-relaxed mb-10" style={{color:'#5A5A6E'}}>
          You're running a 7-figure operation on spreadsheets, group chats, and gut feel. Every lead that doesn't hear back in 5 minutes is gone. Every hour you spend on follow-ups is an hour you can't spend building. I'm <strong style={{color:'#E8E8F0',fontWeight:600}}>Wendel Andrady</strong> — I engineer automated business infrastructure that captures leads, qualifies them, books appointments, and runs your operations while you focus on the 10% only you can do. Delivered in <strong style={{color:'#D4F544',fontWeight:600}}>7 days.</strong>
        </p>
      </R>
      <R d={2.5} className="flex flex-col sm:flex-row items-center justify-center gap-4">
        <motion.button whileHover={{scale:1.04}} whileTap={{scale:.96}} data-h onClick={()=>scrollTo('ctRef')} className="btn-lime glow-lime-btn sm-full">Build My System →</motion.button>
        <motion.button whileHover={{scale:1.04}} whileTap={{scale:.96}} data-h onClick={()=>scrollTo('svc')} className="btn-ghost sm-full">See the Infrastructure</motion.button>
      </R>
      <R d={2.8} className="mt-16 flex flex-wrap items-center justify-center gap-10">
        {[
          {n:'$60K+',l:'Annual labour replaced'},
          {n:'24/7',l:'Lead capture, no staff'},
          {n:'7 Days',l:'Call to live infrastructure'},
          {n:'0',l:'Hours on tasks systems own'}
        ].map((s,i)=>(
          <div key={i} className="text-center">
            <div className="num-xl">{s.n}</div>
            <div className="mono-label mt-1">{s.l}</div>
          </div>
        ))}
      </R>
    </div>
    <motion.div className="absolute bottom-8 left-1/2 -translate-x-1/2 z-10" animate={{y:[0,7,0]}} transition={{duration:2.4,repeat:Infinity,ease:'easeInOut'}}>
      <div className="w-5 h-8 rounded-full flex justify-center pt-2" style={{border:'1px solid #1E1E24'}}>
        <motion.div className="w-1 h-2 rounded-full" style={{background:'rgba(212,245,68,.4)'}} animate={{y:[0,8,0],opacity:[1,.2,1]}} transition={{duration:2.4,repeat:Infinity,ease:'easeInOut'}}/>
      </div>
    </motion.div>
  </section>;
}

/* ══ MARQUEE ══ */
function Marquee({t,rev}){
  const txt=`${t}  ·  ${t}  ·  ${t}  ·  ${t}  ·  `;
  return<div className="overflow-hidden py-5 md:py-6" style={{borderTop:'1px solid #1E1E24',borderBottom:'1px solid #1E1E24'}}>
    <div className={`marquee-track ${rev?'marquee-track-rev':''}`}>
      <span style={{fontFamily:'Instrument Serif',fontSize:'clamp(42px,7vw,80px)',color:'rgba(255,255,255,.05)',whiteSpace:'nowrap'}}>{txt}</span>
    </div>
  </div>;
}

/* ══ PROBLEM ══ */
function Problem({sRef}){
  const scrollToCta=()=>document.getElementById('cta').scrollIntoView({behavior:'smooth'});
  const pains=[
    {t:'You are the system — and the system is breaking',d:'When you\'re the one following up, qualifying, scheduling, and onboarding, you\'re not running a business. You\'re running yourself into the ground. The ceiling on your revenue is the ceiling on your hours.'},

          <h3 className="display mb-3" style={{fontSize:'clamp(28px,4vw,48px)',color:'#E8E8F0'}}>While your competitors wait<br/>on agency timelines,<br/><em style={{color:'#D4F544'}}>you'll already be converting.</em></h3>
          <p className="text-sm mb-2 max-w-md mx-auto" style={{color:'#5A5A6E'}}>Most agencies quote you 8 weeks and $15,000–$30,000 for what I deliver in 7 days. That's not a speed hack — it's what happens when you remove four layers of overhead and talk directly to someone who builds instead of manages.</p>

    </div>
  </section>;
}

/* ══ CONTACT ══ */
function Contact({sRef}){
  const[f,setF]=useState({name:'',email:'',service:'',revenue:'',msg:''});
  const[submitting,setSubmitting]=useState(false);
  const[statusMsg,setStatusMsg]=useState(null);
  const ch=e=>setF({...f,[e.target.name]:e.target.value});

  const sub=async(e)=>{
    e.preventDefault();
    const{name,email,msg}=f;
    if(!name.trim()){setStatusMsg({type:'error',text:'❌ Please enter your name.'});setTimeout(()=>setStatusMsg(null),4000);return;}
    if(!email.trim()){setStatusMsg({type:'error',text:'❌ Please enter your email address.'});setTimeout(()=>setStatusMsg(null),4000);return;}
    if(!msg.trim()){setStatusMsg({type:'error',text:'❌ Please describe the bottleneck you want to fix.'});setTimeout(()=>setStatusMsg(null),4000);return;}
    const emailRegex=/^[^\s@]+@([^\s@.,]+\.)+[^\s@.,]{2,}$/;
    if(!emailRegex.test(email)){setStatusMsg({type:'error',text:'❌ Please enter a valid email address.'});setTimeout(()=>setStatusMsg(null),4000);return;}
    setSubmitting(true);setStatusMsg(null);
    const payload={name:f.name.trim(),email:f.email.trim(),service:f.service,revenue:f.revenue,message:f.msg.trim()};
    const EDGE_FUNCTION_URL='https://rsttirosnsfaortzugld.functions.supabase.co/submit-brief';
    try{
      const response=await fetch(EDGE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(response.ok){
        setStatusMsg({type:'success',text:"✅ Brief received. I'll reply within 24 hours with a clear breakdown."});
        setF({name:'',email:'',service:'',revenue:'',msg:''});
        setTimeout(()=>setStatusMsg(null),7000);
      }else{
        setStatusMsg({type:'error',text:'❌ Something went wrong. Please try again.'});
        setTimeout(()=>setStatusMsg(null),5000);
      }
    }catch(err){
      setStatusMsg({type:'error',text:'❌ Something went wrong. Please try again.'});
      setTimeout(()=>setStatusMsg(null),5000);
    }finally{setSubmitting(false);}
  };

  return(
    <section ref={sRef} id="cta" className="py-24 md:py-32">
      <div className="absolute w-96 h-96 rounded-full -z-10 right-1/3 bottom-0" style={{background:'rgba(212,245,68,.013)',filter:'blur(130px)'}}/>
      <div className="max-w-2xl mx-auto px-6">
        <div className="text-center mb-14">
          <R><span className="mono-label block mb-5">06 — build your infrastructure</span></R>
          <R d={.1}><h2 className="display mb-4" style={{fontSize:'clamp(40px,7vw,80px)',color:'#E8E8F0'}}>Let's close<br/>the leaks.<br/><em style={{color:'#D4F544'}}>This week.</em></h2></R>
          <R d={.2}>
            <p className="text-base mb-2" style={{color:'#5A5A6E'}}>Tell me where your business is bleeding time or money. I'll come back within 24 hours with a clear breakdown of exactly what I'd build, how long it takes, and what it costs.</p>
            <p className="text-sm" style={{color:'#38383F'}}>No pitch. No obligation. A straight answer from someone who builds.</p>
            <p className="text-xs mt-3" style={{color:'rgba(212,245,68,.3)',fontFamily:'DM Mono',letterSpacing:'.05em'}}>If you're revenue-generating and founder-bottlenecked, this is the most valuable 30 minutes you'll spend this week.</p>
          </R>
        </div>
        <R d={.3}>
          <form onSubmit={sub} className="space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <input name="name" value={f.name} onChange={ch} placeholder="Your name" required className="field"/>
              <input name="email" type="email" value={f.email} onChange={ch} placeholder="your@email.com" required className="field"/>
            </div>
            <select name="service" value={f.service} onChange={ch} required className="field" style={{appearance:'none'}}>
              <option value="" disabled>Which system interests you?</option>
              <option value="foundation">The Conversion Foundation — $800</option>
              <option value="acquisition">The Client Acquisition Engine — $3,500</option>
              <option value="alpha">Operational Alpha — $10,000</option>
              <option value="unsure">Not sure yet — let's talk</option>
            </select>
            <select name="revenue" value={f.revenue} onChange={ch} required className="field" style={{appearance:'none'}}>
              <option value="" disabled>Your monthly revenue range</option>
              <option value="under10k">Under $10K/month</option>
              <option value="10k-50k">$10K–$50K/month</option>
              <option value="50k-150k">$50K–$150K/month</option>
              <option value="150k-500k">$150K–$500K/month</option>
              <option value="500k+">$500K+/month</option>
            </select>
            <textarea name="msg" rows="5" value={f.msg} onChange={ch} required
              placeholder="What's the single biggest operational bottleneck costing you time or money right now?" className="field" style={{resize:'none'}}/>
            <div className="flex flex-col sm:flex-row items-center gap-4 pt-1">
              <motion.button type="submit" disabled={submitting} whileHover={{scale:submitting?1:1.04}} whileTap={{scale:submitting?1:.96}} data-h
                className="btn-lime glow-lime-btn flex items-center gap-2 sm-full justify-center disabled:opacity-60">
                {submitting?'Submitting...':'Send My Brief'}
                {!submitting&&<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M8 3l5 5-5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </motion.button>
              <span className="text-sm" style={{color:'#38383F'}}>or</span>
              <motion.button type="button" whileHover={{scale:1.04}} whileTap={{scale:.96}} data-h
                onClick={()=>window.open('https://wa.me/27715165243','_blank')}
                className="btn-ghost flex items-center gap-2 sm-full justify-center"
                style={{borderColor:'rgba(37,211,102,.2)',color:'#4ade80'}}>
                <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                WhatsApp Me
              </motion.button>
            </div>
            {statusMsg&&<div className={`status-message ${statusMsg.type==='success'?'bg-lime/10 text-lime border border-lime/30':'bg-rose/10 text-rose border border-rose/20'}`}>{statusMsg.text}</div>}
          </form>
        </R>
        <R d={.5} className="mt-10 grid grid-cols-3 gap-4 text-center">
          {[{e:'⚡',t:'Reply in 24h'},{e:'📋',t:'Diagnostic call — no pitch'},{e:'🚀',t:'Infrastructure live in 7 days'}].map((r,i)=>(
            <div key={i} className="py-4 px-2 rounded-xl" style={{background:'#111114',border:'1px solid #1E1E24'}}>
              <div style={{fontSize:'22px',marginBottom:'6px'}}>{r.e}</div>
              <p className="text-xs font-sans" style={{color:'#E8E8F0',fontWeight:500}}>{r.t}</p>
            </div>
          ))}
        </R>
      </div>
    </section>
  );
}

    <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4">
      <span style={{fontFamily:'Syne',fontWeight:800,fontSize:'15px',color:'rgba(232,232,240,.25)'}}>Wendel<span style={{color:'rgba(212,245,68,.3)'}}>.</span></span>

/* ══ APP ══ */

  const[ld,setLd]=useState(true);
  const hero=useRef(null),prob=useRef(null),svc=useRef(null),work=useRef(null),proc=useRef(null),ctRef=useRef(null);
  const refs={hero,prob,svc,work,proc,ctRef};
  return<div style={{background:'#0C0C0E',color:'#E8E8F0',minHeight:'100vh'}}>

    <Cursor/><ProgressBar/>

    <Marquee t="CLOSE THE LEAKS  ·  REMOVE THE BOTTLENECK  ·  SCALE WITHOUT HIRING  ·  BUILT IN 7 DAYS"/>
    <Problem sRef={prob}/>
    <Systems sRef={svc}/>

    <Diff/>

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
