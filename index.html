<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wendel Andrady — Custom Business Systems</title>
  <meta name="description" content="Replace your spreadsheets, CRM, and email threads with one custom system. Live in as little as 7 days.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0A0A0B',
            'ink-card': '#0F0F12',
            'ink-border': '#1A1A1F',
            'ink-muted': '#55555F',
            'ink-subtle': '#333339',
            lime: '#C8E64A',
            'lime-dim': '#A8C43A',
          },
          fontFamily: {
            display: ['"Instrument Serif"', 'serif'],
            sans: ['"Syne"', 'sans-serif'],
            mono: ['"DM Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --lime: #C8E64A;
      --lime-dim: #A8C43A;
      --ink: #0A0A0B;
      --ink-card: #0F0F12;
      --ink-border: #1A1A1F;
      --ink-muted: #55555F;
      --ink-subtle: '#333339';
    }

    *, *::before, *::after {
      box-sizing: border-box;
      cursor: none;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--ink);
      color: #E2E2E8;
      font-family: 'Syne', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 99px; }
    ::selection { background: rgba(200, 230, 74, 0.15); color: #fff; }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    .glow-btn {
      box-shadow: 0 0 25px rgba(200,230,74,0.2), 0 2px 20px rgba(200,230,74,0.08);
    }

    .display {
      font-family: 'Instrument Serif', serif;
      line-height: 1.02;
      letter-spacing: -0.015em;
    }

    .label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .card {
      background: var(--ink-card);
      border: 1px solid var(--ink-border);
      border-radius: 18px;
      padding: 28px;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .card:hover {
      border-color: rgba(200,230,74,0.12);
      box-shadow: 0 0 35px rgba(200,230,74,0.03);
    }

    .card-accent {
      background: var(--ink-card);
      border: 1px solid rgba(200,230,74,0.12);
      border-radius: 18px;
      padding: 28px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .card-accent::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,230,74,0.18), transparent);
    }

    .card-accent:hover {
      border-color: rgba(200,230,74,0.25);
      box-shadow: 0 0 40px rgba(200,230,74,0.04);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(200,230,74,0.06);
      border: 1px solid rgba(200,230,74,0.1);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime);
    }

    .field {
      width: 100%;
      padding: 14px 18px;
      background: var(--ink-card);
      border: 1px solid var(--ink-border);
      border-radius: 12px;
      color: #E2E2E8;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .field:focus {
      border-color: rgba(200,230,74,0.35);
      box-shadow: 0 0 0 2px rgba(200,230,74,0.05);
    }

    .field::placeholder { color: var(--ink-muted); }

    .btn-primary {
      background: var(--lime);
      color: var(--ink);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      padding: 15px 34px;
      border-radius: 999px;
      font-size: 14px;
      letter-spacing: 0.005em;
      border: none;
      transition: background 0.25s, box-shadow 0.25s, transform 0.2s;
      box-shadow: 0 0 25px rgba(200,230,74,0.18);
    }

    .btn-primary:hover {
      background: var(--lime-dim);
      box-shadow: 0 0 40px rgba(200,230,74,0.3);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: #E2E2E8;
      font-family: 'Syne', sans-serif;
      font-weight: 500;
      padding: 15px 34px;
      border-radius: 999px;
      font-size: 14px;
      border: 1px solid var(--ink-border);
      transition: border-color 0.25s, color 0.25s, transform 0.2s;
    }

    .btn-secondary:hover {
      border-color: rgba(200,230,74,0.25);
      color: var(--lime);
      transform: translateY(-1px);
    }

    .x-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255,80,80,0.06);
      border: 1px solid rgba(255,80,80,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(200,230,74,0.06);
      border: 1px solid rgba(200,230,74,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .marquee-track {
      display: inline-flex;
      animation: scroll 35s linear infinite;
      white-space: nowrap;
    }

    .marquee-track-rev {
      animation-direction: reverse;
      animation-duration: 42s;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .step-num {
      font-family: 'Instrument Serif', serif;
      font-size: 100px;
      line-height: 1;
      color: rgba(200,230,74,0.04);
      position: absolute;
      top: -15px;
      right: 18px;
      pointer-events: none;
      user-select: none;
    }

    .metric-box {
      background: rgba(200,230,74,0.03);
      border: 1px solid rgba(200,230,74,0.07);
      border-radius: 12px;
      padding: 18px 22px;
    }

    .before-tag {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,80,80,0.05);
      border: 1px solid rgba(255,80,80,0.08);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,80,80,0.45);
    }

    .after-tag {
      display: inline-flex;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(200,230,74,0.06);
      border: 1px solid rgba(200,230,74,0.1);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--lime);
    }

    .qualify-for {
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(200,230,74,0.04);
      border: 1px solid rgba(200,230,74,0.08);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(200,230,74,0.6);
    }

    .qualify-not {
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(255,80,80,0.03);
      border: 1px solid rgba(255,80,80,0.06);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255,80,80,0.35);
    }

    .status-msg {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 11px 16px;
      border-radius: 99px;
      text-align: center;
      margin-top: 14px;
    }

    .sys-num {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      color: rgba(200,230,74,0.12);
      line-height: 1;
      flex-shrink: 0;
      width: 36px;
    }

    @media (hover: none) {
      * { cursor: auto !important; }
      .cc, .cr { display: none !important; }
      a, button, input, textarea, select { cursor: auto !important; }
    }

    @media (max-width: 640px) {
      .sm-full { width: 100% !important; }
      .ba-grid { flex-direction: column !important; gap: 0.75rem !important; }
      .ba-grid .ba-arrow { transform: rotate(90deg); }
    }
  </style>
</head>
<body class="grid-bg">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const { motion, AnimatePresence } = window.Motion;

/* ═══════════════════════════════════════════
   CURSOR
   ═══════════════════════════════════════════ */
function Cursor() {
  const dot = useRef(null);
  const ring = useRef(null);

  useEffect(() => {
    let mx = 0, my = 0, rx = 0, ry = 0;

    const onMove = (e) => {
      mx = e.clientX;
      my = e.clientY;
      if (dot.current) {
        dot.current.style.transform = `translate(${mx - 3}px, ${my - 3}px)`;
      }
      const t = e.target.closest('a, button, input, textarea, select, [data-h]');
      if (ring.current) {
        const s = t ? '50px' : '34px';
        const o = t ? -25 : -17;
        ring.current.style.width = s;
        ring.current.style.height = s;
        ring.current.style.left = o + 'px';
        ring.current.style.top = o + 'px';
        ring.current.style.borderColor = t ? 'var(--lime)' : 'rgba(200,230,74,0.22)';
        ring.current.style.opacity = t ? '0.9' : '0.5';
      }
    };

    const loop = () => {
      rx += (mx - rx) * 0.11;
      ry += (my - ry) * 0.11;
      if (ring.current) ring.current.style.transform = `translate(${rx}px, ${ry}px)`;
      requestAnimationFrame(loop);
    };

    window.addEventListener('mousemove', onMove);
    loop();
    return () => window.removeEventListener('mousemove', onMove);
  }, []);

  return (
    <>
      <div ref={dot} className="cc fixed w-[6px] h-[6px] rounded-full pointer-events-none" style={{ background: 'var(--lime)', mixBlendMode: 'difference', zIndex: 10000 }} />
      <div ref={ring} className="cr fixed rounded-full pointer-events-none" style={{ width: '34px', height: '34px', border: '1px solid rgba(200,230,74,0.22)', left: 0, top: 0, transition: 'width 0.2s, height 0.2s, left 0.2s, top 0.2s, border-color 0.2s, opacity 0.2s', zIndex: 10000 }} />
    </>
  );
}

/* ═══════════════════════════════════════════
   PROGRESS BAR
   ═══════════════════════════════════════════ */
function ProgressBar() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const fn = () => {
      const t = document.documentElement.scrollHeight - window.innerHeight;
      setP(t > 0 ? (window.scrollY / t) * 100 : 0);
    };
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return <div className="fixed top-0 left-0 h-[2px]" style={{ width: p + '%', background: 'var(--lime)', zIndex: 9998 }} />;
}

/* ═══════════════════════════════════════════
   REVEAL
   ═══════════════════════════════════════════ */
function R({ children, d = 0, className = '', y = 26 }) {
  return (
    <motion.div
      initial={{ opacity: 0, y }}
      whileInView={{ opacity: 1, y: 0 }}
      viewport={{ once: true, margin: '-30px' }}
      transition={{ duration: 0.65, delay: d, ease: [0.22, 0.61, 0.36, 1] }}
      className={className}
    >
      {children}
    </motion.div>
  );
}

/* ═══════════════════════════════════════════
   THREE.JS BACKGROUND
   ═══════════════════════════════════════════ */
function ThreeBG() {
  const ref = useRef(null);

  useEffect(() => {
    const mob = window.innerWidth < 768;
    const W = window.innerWidth;
    const H = window.innerHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 100);
    camera.position.z = 5.5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, mob ? 1.5 : 2));
    ref.current.appendChild(renderer.domElement);

    const mat1 = new THREE.MeshBasicMaterial({ color: 0xC8E64A, wireframe: true, transparent: true, opacity: 0.035 });
    const mat2 = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true, transparent: true, opacity: 0.02 });
    const m1 = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 1), mat1);
    const m2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 1), mat2);
    scene.add(m1, m2);

    const mkTex = (c) => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 64;
      const x = cv.getContext('2d');
      const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, c);
      g.addColorStop(0.4, c.replace(',1)', ',0.3)'));
      g.addColorStop(1, c.replace(',1)', ',0)'));
      x.fillStyle = g;
      x.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(cv);
    };

    const mkPts = (n, col, sz, op, rMin, rSpr) => {
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = rMin + Math.random() * rSpr;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i*3] = r * Math.sin(ph) * Math.cos(th);
        pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pos[i*3+2] = r * Math.cos(ph);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      return new THREE.Points(g, new THREE.PointsMaterial({
        map: mkTex(col), size: sz, transparent: true, opacity: op,
        blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
      }));
    };

    const p1 = mkPts(mob ? 120 : 500, 'rgba(200,230,74,1)', mob ? 0.04 : 0.025, 0.35, 2.5, 5);
    const p2 = mkPts(mob ? 30 : 120, 'rgba(180,180,190,1)', mob ? 0.035 : 0.02, 0.18, 3, 4);
    scene.add(p1, p2);

    let mx = 0, my = 0;
    const onM = (e) => { mx = (e.clientX / W) * 2 - 1; my = -(e.clientY / H) * 2 + 1; };
    window.addEventListener('mousemove', onM);

    let id;
    const tick = () => {
      id = requestAnimationFrame(tick);
      const t = performance.now() * 0.001;
      m1.rotation.x = t * 0.03 + my * 0.15;
      m1.rotation.y = t * 0.045 + mx * 0.15;
      m2.rotation.x = -t * 0.025 + my * 0.08;
      m2.rotation.y = -t * 0.035 + mx * 0.08;
      p1.rotation.y = t * 0.008;
      p2.rotation.y = -t * 0.005;
      renderer.render(scene, camera);
    };
    tick();

    const onR = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener('resize', onR);

    return () => {
      cancelAnimationFrame(id);
      window.removeEventListener('resize', onR);
      window.removeEventListener('mousemove', onM);
      if (ref.current && renderer.domElement.parentNode === ref.current) {
        ref.current.removeChild(renderer.domElement);
      }
      renderer.dispose();
    };
  }, []);

  return <div ref={ref} className="fixed inset-0" style={{ zIndex: -10 }} />;
}

/* ═══════════════════════════════════════════
   PRELOADER
   ═══════════════════════════════════════════ */
function Preloader({ done }) {
  const [n, setN] = useState(0);

  useEffect(() => {
    const iv = setInterval(() => {
      setN(p => {
        if (p >= 100) {
          clearInterval(iv);
          setTimeout(done, 300);
          return 100;
        }
        return p + 2;
      });
    }, 16);
    return () => clearInterval(iv);
  }, [done]);

  return (
    <motion.div
      exit={{ y: '-100%' }}
      transition={{ duration: 0.7, ease: [0.76, 0, 0.24, 1] }}
      className="fixed inset-0 flex flex-col items-center justify-center"
      style={{ background: 'var(--ink)', zIndex: 9999 }}
    >
      <div style={{ fontFamily: 'Instrument Serif', fontSize: 'clamp(70px,13vw,130px)', color: 'var(--lime)', lineHeight: 1 }}>{n}</div>
      <div className="mt-4 w-32 h-[1px] overflow-hidden" style={{ background: 'var(--ink-border)' }}>
        <motion.div className="h-full" initial={{ width: '0%' }} animate={{ width: n + '%' }} style={{ background: 'var(--lime)' }} />
      </div>
    </motion.div>
  );
}

/* ═══════════════════════════════════════════
   NAVBAR
   ═══════════════════════════════════════════ */
function Nav({ refs }) {
  const [sc, setSc] = useState(false);
  const [mo, setMo] = useState(false);

  useEffect(() => {
    const fn = () => setSc(window.scrollY > 40);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const go = useCallback((r) => {
    r.current.scrollIntoView({ behavior: 'smooth' });
    setMo(false);
  }, []);

  const links = [
    { l: 'Problem', r: refs.problem },
    { l: 'Solution', r: refs.solution },
    { l: 'Proof', r: refs.proof },
    { l: 'Process', r: refs.process },
  ];

  return (
    <motion.nav
      initial={{ opacity: 0, y: -18 }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ duration: 0.5, delay: 1.4 }}
      className="fixed w-full"
      style={{
        zIndex: 50,
        background: sc ? 'rgba(10,10,11,0.9)' : 'transparent',
        backdropFilter: sc ? 'blur(18px)' : 'none',
        borderBottom: sc ? '1px solid var(--ink-border)' : 'none',
        padding: sc ? '11px 0' : '20px 0',
        transition: 'all 0.35s'
      }}
    >
      <div className="max-w-5xl mx-auto px-6 flex items-center justify-between">
        <button onClick={() => go(refs.hero)} data-h style={{ fontFamily: 'Instrument Serif', fontSize: '20px', color: '#E2E2E8', background: 'none', border: 'none', padding: 0 }}>
          Wendel
        </button>
        <div className="hidden md:flex items-center gap-1">
          {links.map(lk => (
            <button key={lk.l} onClick={() => go(lk.r)} data-h className="px-4 py-2 text-[13px]" style={{ color: 'var(--ink-muted)', background: 'none', border: 'none', transition: 'color 0.25s' }}
              onMouseEnter={e => e.currentTarget.style.color = 'var(--lime)'}
              onMouseLeave={e => e.currentTarget.style.color = 'var(--ink-muted)'}>
              {lk.l}
            </button>
          ))}
          {/* CHANGED: CTA copy updated to outcome-based language */}
          <button onClick={() => go(refs.cta)} data-h className="btn-primary ml-2" style={{ padding: '9px 22px', fontSize: '12px' }}>
            See Your System Breakdown
          </button>
        </div>
        <button onClick={() => setMo(!mo)} data-h className="md:hidden flex flex-col items-center justify-center gap-1.5 w-10 h-10" style={{ background: 'none', border: 'none' }}>
          <motion.span animate={mo ? { rotate: 45, y: 6 } : { rotate: 0, y: 0 }} className="block w-5 h-[1.5px] origin-center" style={{ background: 'var(--lime)' }} />
          <motion.span animate={mo ? { opacity: 0 } : { opacity: 1 }} className="block w-5 h-[1.5px]" style={{ background: 'var(--lime)' }} />
          <motion.span animate={mo ? { rotate: -45, y: -6 } : { rotate: 0, y: 0 }} className="block w-5 h-[1.5px] origin-center" style={{ background: 'var(--lime)' }} />
        </button>
      </div>
      <AnimatePresence>
        {mo && (
          <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} transition={{ duration: 0.25 }}
            className="md:hidden overflow-hidden" style={{ background: 'rgba(10,10,11,0.97)', backdropFilter: 'blur(18px)', borderTop: '1px solid var(--ink-border)' }}>
            <div className="px-6 py-5 space-y-1">
              {links.map((lk, i) => (
                <motion.button key={lk.l} initial={{ opacity: 0, x: -12 }} animate={{ opacity: 1, x: 0 }} transition={{ delay: i * 0.04 }}
                  onClick={() => go(lk.r)} className="block w-full text-left py-3 text-base" style={{ color: 'var(--ink-muted)', background: 'none', border: 'none' }}>{lk.l}</motion.button>
              ))}
              <button onClick={() => go(refs.cta)} className="btn-primary w-full mt-3" style={{ fontSize: '13px' }}>See Your System Breakdown</button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </motion.nav>
  );
}

/* ═══════════════════════════════════════════
   1. HERO — REWRITTEN
   ═══════════════════════════════════════════ */
function Hero({ refs }) {

    { n: '02', t: 'Build', d: 'I design and build your system directly. No agency layers, no handoffs, no surprises.' },
    { n: '03', t: 'Launch', d: 'Your system goes live. Core build delivered in as little as 7 days.' },
  ];

  return (
    <section ref={sectionRef} className="py-20 md:py-28">
      <div className="max-w-5xl mx-auto px-6">
        <div className="text-center mb-12">
          <R><span className="label block mb-4">Process</span></R>
          <R d={0.08}>
            <h2 className="display" style={{ fontSize: 'clamp(32px,4.5vw,50px)', color: '#E2E2E8' }}>
              Understand. Build. <em style={{ color: 'var(--lime)', fontStyle: 'italic' }}>Launch.</em>
            </h2>
          </R>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-9">
          {steps.map((s, i) => (
            <R key={i} d={i * 0.08}>
              <div className="card h-full text-center py-10 px-5 relative overflow-hidden">
                <div className="step-num">{s.n}</div>
                <div className="relative z-10">
                  <span className="label block mb-5">{s.n}</span>
                  <p className="text-lg mb-2" style={{ color: '#E2E2E8', fontWeight: 700 }}>{s.t}</p>
                  <p className="text-[13px] leading-relaxed" style={{ color: 'var(--ink-muted)' }}>{s.d}</p>
                </div>
              </div>
            </R>
          ))}
        </div>
        <R d={0.3} className="text-center">
          <button onClick={go} className="btn-primary glow-btn" data-h>Get your system breakdown</button>
        </R>
      </div>
    </section>
  );
}

/* ═══════════════════════════════════════════
   9. QUALIFICATION — REFINED
   ═══════════════════════════════════════════ */
function Qualification() {
  return (
    <section className="py-16 md:py-20" style={{ background: 'rgba(15,15,18,0.5)', borderTop: '1px solid var(--ink-border)', borderBottom: '1px solid var(--ink-border)' }}>
      <div className="max-w-xl mx-auto px-6 text-center">
        <R><span className="label block mb-5">This is for</span></R>
        <div className="space-y-3 mb-8">
          {/* CHANGED: Qualification criteria made more specific */}
          <R d={0.06}><div className="qualify-for">Service businesses, agencies, or consultants generating consistent revenue</div></R>
          <R d={0.1}><div className="qualify-for">Founders spending too much time on admin, follow-ups, or client management</div></R>
          <R d={0.14}><div className="qualify-for">Teams ready to scale but limited by their current tools and processes</div></R>
        </div>
        <R d={0.18}><span className="label block mb-4">This is not for</span></R>
        <div className="space-y-3">
          <R d={0.22}><div className="qualify-not">Pre-revenue or early-stage businesses</div></R>
          <R d={0.26}><div className="qualify-not">Those looking for a standalone website without operational integration</div></R>
        </div>
      </div>
    </section>
  );
}

/* ═══════════════════════════════════════════
   10. FINAL CTA — IMPROVED
   ═══════════════════════════════════════════ */
function FinalCTA({ sectionRef }) {
  const [form, setForm] = useState({ name: '', email: '', msg: '' });
  const [submitting, setSubmitting] = useState(false);
  const [status, setStatus] = useState(null);
  const timerRef = useRef(null);

  const ch = (e) => setForm({ ...form, [e.target.name]: e.target.value });

  const clearStatus = () => {
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setStatus(null), 5000);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.email.trim() || !form.msg.trim()) {
      setStatus({ t: 'error', m: 'Please fill in all fields.' });
      clearStatus();
      return;
    }
    setSubmitting(true);
    setStatus(null);
    try {
      const res = await fetch('https://rsttirosnsfaortzugld.functions.supabase.co/submit-brief', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: form.name.trim(), email: form.email.trim(), message: form.msg.trim() })
      });
      if (res.ok) {
        setStatus({ t: 'ok', m: "Received. I'll reply within 24 hours with your system breakdown." });
        setForm({ name: '', email: '', msg: '' });
      } else {
        setStatus({ t: 'error', m: 'Something went wrong. Please try again.' });
      }
    } catch {
      setStatus({ t: 'error', m: 'Something went wrong. Please try again.' });
    } finally {
      setSubmitting(false);
      clearStatus();
    }
  };

  return (
    <section ref={sectionRef} id="cta" className="py-20 md:py-28 relative">
      <div className="absolute w-80 h-80 rounded-full" style={{ background: 'rgba(200,230,74,0.01)', filter: 'blur(100px)', right: '30%', bottom: 0, zIndex: -1 }} />
      <div className="max-w-md mx-auto px-6 text-center">
        <R><span className="label block mb-4">Get Started</span></R>
        <R d={0.08}>
          {/* CHANGED: CTA headline updated — outcome-focused */}
          <h2 className="display mb-4" style={{ fontSize: 'clamp(36px,6vw,60px)', color: '#E2E2E8' }}>
            See exactly what your<br /><em style={{ color: 'var(--lime)', fontStyle: 'italic' }}>system would include</em>
          </h2>
        </R>
        <R d={0.14}>
          {/* CHANGED: Sub-copy more specific */}
          <p className="text-[14px] leading-relaxed mb-3" style={{ color: 'var(--ink-muted)' }}>
            Describe what you're working with and where the friction is. I'll come back with a clear breakdown of what I'd build — and what it would cost.
          </p>
        </R>
        <R d={0.18}>
          {/* CHANGED: Reassurance line refined */}
          <p className="text-[11px] mb-8" style={{ color: 'var(--ink-subtle)' }}>No sales call required. No commitment. Just clarity.</p>
        </R>
        <R d={0.22}>
          <form onSubmit={submit} className="space-y-3 text-left">
            <input name="name" value={form.name} onChange={ch} placeholder="Your name" required className="field" />
            <input name="email" type="email" value={form.email} onChange={ch} placeholder="your@email.com" required className="field" />
            {/* CHANGED: Textarea placeholder made more specific */}
            <textarea name="msg" rows={3} value={form.msg} onChange={ch} required placeholder="What tools are you currently using, and what's the biggest operational problem you want solved?" className="field" style={{ resize: 'none' }} />
            <motion.button type="submit" disabled={submitting} whileHover={{ scale: submitting ? 1 : 1.03 }} whileTap={{ scale: submitting ? 1 : 0.97 }} data-h
              className="btn-primary glow-btn w-full" style={{ opacity: submitting ? 0.5 : 1 }}>
              {/* CHANGED: Button label updated */}
              {submitting ? 'Sending...' : 'Get my system breakdown'}
            </motion.button>
            {status && (
              <div className={`status-msg ${status.t === 'ok' ? 'bg-lime/10 text-lime border border-lime/25' : 'bg-rose/10 text-rose border border-rose/18'}`}>
                {status.m}
              </div>
            )}
          </form>
        </R>
      </div>
    </section>
  );
}

/* ═══════════════════════════════════════════
   FOOTER
   ═══════════════════════════════════════════ */
function Footer() {
  return (
    <footer className="py-7" style={{ borderTop: '1px solid var(--ink-border)' }}>
      <div className="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-3">
        <span style={{ fontFamily: 'Instrument Serif', fontSize: '17px', color: 'rgba(226,226,232,0.2)' }}>Wendel</span>
        <span style={{ fontFamily: 'DM Mono', fontSize: '10px', color: 'var(--ink-subtle)', letterSpacing: '0.06em' }}>© {new Date().getFullYear()}</span>
        <span style={{ fontFamily: 'DM Mono', fontSize: '10px', color: 'var(--ink-subtle)', letterSpacing: '0.04em' }}>Custom business systems</span>
      </div>
    </footer>
  );
}

    </motion.a>

/* ═══════════════════════════════════════════
   APP
   ═══════════════════════════════════════════ */
function App() {
  const [loading, setLoading] = useState(true);
  const done = useCallback(() => setLoading(false), []);

  const hero = useRef(null);
  const problem = useRef(null);
  const solution = useRef(null);
  const proof = useRef(null);
  const process = useRef(null);
  const cta = useRef(null);

  const refs = { hero, problem, solution, proof, process, cta };

  return (
    <div style={{ background: 'var(--ink)', color: '#E2E2E8', minHeight: '100vh' }}>
      <AnimatePresence>{loading && <Preloader done={done} />}</AnimatePresence>
      <Cursor />
      <ProgressBar />
      <Nav refs={refs} />
      <Hero refs={refs} />
      <Marquee text="ONE SYSTEM · ZERO MANUAL OVERHEAD · EVERYTHING CONNECTED" />
      <Problem sectionRef={problem} />
      <Solution sectionRef={solution} />
      <WhatYouGet />
      <Outcomes />
      <Proof sectionRef={proof} />
      <Pricing />
      <Process sectionRef={process} />
      <Qualification />
      <FinalCTA sectionRef={cta} />
      <Footer />
      <WA />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
