<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrady — AI-Powered Operating Systems for Agencies</title>
  <meta name="description" content="Andrady builds AI-powered operating systems for agencies. Replace scattered tools, manual admin, and disconnected workflows with one intelligent operational platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#080809',
            'ink-card': '#0D0D10',
            'ink-border': '#181820',
            'ink-muted': '#52525C',
            'ink-subtle': '#2E2E38',
            lime: '#C8E64A',
            'lime-dim': '#A8C43A',
          },
          fontFamily: {
            display: ['"Instrument Serif"', 'serif'],
            sans: ['"Syne"', 'sans-serif'],
            mono: ['"DM Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --lime: #C8E64A;
      --lime-dim: #A8C43A;
      --ink: #080809;
      --ink-card: #0D0D10;
      --ink-border: #181820;
      --ink-muted: #52525C;
      --ink-subtle: #2E2E38;
      --red: rgba(255,72,72,0.7);
    }

    *, *::before, *::after { box-sizing: border-box; cursor: none; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--ink); color: #E2E2E8; font-family: 'Syne', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 99px; }
    ::selection { background: rgba(200,230,74,0.12); color: #fff; }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255,255,255,0.013) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.013) 1px, transparent 1px);
      background-size: 56px 56px;
    }

    .display { font-family: 'Instrument Serif', serif; line-height: 1.02; letter-spacing: -0.015em; }
    .label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); }

    /* Cards */
    .card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 18px; padding: 28px; transition: border-color 0.4s, box-shadow 0.4s; }
    .card:hover { border-color: rgba(200,230,74,0.1); box-shadow: 0 0 40px rgba(200,230,74,0.025); }
    .card-accent { background: var(--ink-card); border: 1px solid rgba(200,230,74,0.12); border-radius: 18px; padding: 28px; position: relative; overflow: hidden; }
    .card-accent::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,230,74,0.18), transparent); }

    .pill { display: inline-flex; align-items: center; padding: 5px 14px; border-radius: 999px; background: rgba(200,230,74,0.05); border: 1px solid rgba(200,230,74,0.12); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lime); }

    .field { width: 100%; padding: 14px 18px; background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 12px; color: #E2E2E8; font-family: 'Syne', sans-serif; font-size: 14px; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
    .field:focus { border-color: rgba(200,230,74,0.3); box-shadow: 0 0 0 2px rgba(200,230,74,0.04); }
    .field::placeholder { color: var(--ink-muted); }

    .btn-primary { background: var(--lime); color: var(--ink); font-family: 'Syne', sans-serif; font-weight: 700; padding: 15px 34px; border-radius: 999px; font-size: 14px; letter-spacing: 0.005em; border: none; transition: background 0.25s, box-shadow 0.25s, transform 0.2s; box-shadow: 0 0 28px rgba(200,230,74,0.16); cursor: none; }
    .btn-primary:hover { background: var(--lime-dim); box-shadow: 0 0 44px rgba(200,230,74,0.28); transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: #E2E2E8; font-family: 'Syne', sans-serif; font-weight: 500; padding: 15px 34px; border-radius: 999px; font-size: 14px; border: 1px solid var(--ink-border); transition: border-color 0.25s, color 0.25s, transform 0.2s; cursor: none; }
    .btn-secondary:hover { border-color: rgba(200,230,74,0.2); color: var(--lime); transform: translateY(-1px); }
    .glow-btn { box-shadow: 0 0 28px rgba(200,230,74,0.18), 0 2px 20px rgba(200,230,74,0.06); }

    .check-icon { width: 20px; height: 20px; border-radius: 50%; background: rgba(200,230,74,0.05); border: 1px solid rgba(200,230,74,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .x-icon { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,80,80,0.05); border: 1px solid rgba(255,80,80,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Marquee */
    .marquee-track { display: inline-flex; animation: scroll 40s linear infinite; white-space: nowrap; }
    .marquee-rev { animation-direction: reverse; animation-duration: 50s; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* AI Badge */
    .ai-badge { display: inline-flex; align-items: center; gap: 7px; padding: 5px 14px 5px 8px; border-radius: 999px; background: rgba(200,230,74,0.04); border: 1px solid rgba(200,230,74,0.1); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(200,230,74,0.7); }
    .ai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,230,74,0.4); } 50% { box-shadow: 0 0 0 5px rgba(200,230,74,0); } }

    /* Dashboard Preview */
    .dash-card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 10px; overflow: hidden; }
    .dash-header { padding: 8px 14px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--ink-border); }
    .dash-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Flow node */
    .flow-node { padding: 8px 16px; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em; border: 1px solid var(--ink-border); background: var(--ink-card); color: rgba(226,226,232,0.6); white-space: nowrap; }
    .flow-node-active { border-color: rgba(200,230,74,0.25); color: var(--lime); background: rgba(200,230,74,0.04); }
    .flow-arrow { color: var(--ink-subtle); font-size: 14px; flex-shrink: 0; }

    /* System cards */
    .sys-card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 14px; padding: 22px 24px; transition: border-color 0.35s, transform 0.35s; }
    .sys-card:hover { border-color: rgba(200,230,74,0.14); transform: translateY(-2px); }

    /* Before/after tags */
    .before-tag { display: inline-flex; padding: 3px 10px; border-radius: 6px; background: rgba(255,72,72,0.04); border: 1px solid rgba(255,72,72,0.08); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,72,72,0.4); }
    .after-tag { display: inline-flex; padding: 3px 10px; border-radius: 6px; background: rgba(200,230,74,0.05); border: 1px solid rgba(200,230,74,0.1); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lime); }

    /* Replace row */
    .replace-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; background: var(--ink-card); border: 1px solid var(--ink-border); transition: border-color 0.3s; }
    .replace-row:hover { border-color: rgba(200,230,74,0.1); }

    /* Qualify */
    .qualify-for { padding: 8px 14px; border-radius: 10px; background: rgba(200,230,74,0.03); border: 1px solid rgba(200,230,74,0.07); font-size: 13px; color: rgba(200,230,74,0.55); }
    .qualify-not { padding: 8px 14px; border-radius: 10px; background: rgba(255,72,72,0.02); border: 1px solid rgba(255,72,72,0.05); font-size: 13px; color: rgba(255,72,72,0.3); }

    /* Metric */
    .metric-box { background: rgba(200,230,74,0.03); border: 1px solid rgba(200,230,74,0.07); border-radius: 10px; padding: 10px 14px; }
    .stat-card { background: rgba(200,230,74,0.03); border: 1px solid rgba(200,230,74,0.07); border-radius: 14px; padding: 20px 18px; text-align: center; }

    /* FAQ */
    .faq-item { border-bottom: 1px solid var(--ink-border); }
    .faq-item:last-child { border-bottom: none; }

    /* Step */
    .step-num { font-family: 'Instrument Serif', serif; font-size: 80px; line-height: 1; color: rgba(200,230,74,0.03); position: absolute; top: -10px; right: 14px; pointer-events: none; user-select: none; }

    /* Status */
    .status-msg { font-family: 'DM Mono', monospace; font-size: 12px; padding: 11px 16px; border-radius: 99px; text-align: center; margin-top: 12px; }

    /* Workflow animation */
    @keyframes flowIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    .flow-animate { animation: flowIn 0.4s ease forwards; }

    /* Cursor hide on touch */
    @media (hover: none) { * { cursor: auto !important; } .cc, .cr { display: none !important; } }

    @media (max-width: 640px) {
      .sm-full { width: 100% !important; }
    }

    /* Infra ticker */
    .infra-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 999px; background: var(--ink-card); border: 1px solid var(--ink-border); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--ink-muted); white-space: nowrap; transition: border-color 0.3s, color 0.3s; }
    .infra-chip:hover { border-color: rgba(200,230,74,0.2); color: rgba(200,230,74,0.7); }
    .infra-chip-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--lime); opacity: 0.4; flex-shrink: 0; }
  </style>
</head>
<body class="grid-bg">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const { motion, AnimatePresence } = window.Motion;

/* ─── CURSOR ─── */
function Cursor() {
  const dot = useRef(null);
  const ring = useRef(null);
  useEffect(() => {
    let mx=0,my=0,rx=0,ry=0;
    const onMove=(e)=>{
      mx=e.clientX; my=e.clientY;
      if(dot.current) dot.current.style.transform=`translate(${mx-3}px,${my-3}px)`;
      const t=e.target.closest('a,button,input,textarea,select,[data-h]');
      if(ring.current){
        const s=t?'48px':'32px'; const o=t?-24:-16;
        ring.current.style.width=s; ring.current.style.height=s;
        ring.current.style.left=o+'px'; ring.current.style.top=o+'px';
        ring.current.style.borderColor=t?'var(--lime)':'rgba(200,230,74,0.18)';
        ring.current.style.opacity=t?'0.85':'0.45';
      }
    };
    const loop=()=>{ rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1; if(ring.current) ring.current.style.transform=`translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); };
    window.addEventListener('mousemove',onMove); loop();
    return ()=>window.removeEventListener('mousemove',onMove);
  },[]);
  return (<>
    <div ref={dot} className="cc fixed w-[6px] h-[6px] rounded-full pointer-events-none" style={{background:'var(--lime)',mixBlendMode:'difference',zIndex:10000}}/>
    <div ref={ring} className="cr fixed rounded-full pointer-events-none" style={{width:'32px',height:'32px',border:'1px solid rgba(200,230,74,0.18)',left:0,top:0,transition:'width 0.2s,height 0.2s,left 0.2s,top 0.2s,border-color 0.2s,opacity 0.2s',zIndex:10000}}/>
  </>);
}

/* ─── PROGRESS BAR ─── */
function ProgressBar(){
  const [p,setP]=useState(0);
  useEffect(()=>{
    const fn=()=>{const t=document.documentElement.scrollHeight-window.innerHeight; setP(t>0?(window.scrollY/t)*100:0);};
    window.addEventListener('scroll',fn); return ()=>window.removeEventListener('scroll',fn);
  },[]);
  return <div className="fixed top-0 left-0 h-[2px]" style={{width:p+'%',background:'var(--lime)',zIndex:9998}}/>;
}

/* ─── REVEAL ─── */
function R({children,d=0,className='',y=22}){
  return (
    <motion.div initial={{opacity:0,y}} whileInView={{opacity:1,y:0}} viewport={{once:true,margin:'-30px'}} transition={{duration:0.6,delay:d,ease:[0.22,0.61,0.36,1]}} className={className}>
      {children}
    </motion.div>
  );
}

/* ─── THREE.JS BG ─── */
function ThreeBG(){
  const ref=useRef(null);
  useEffect(()=>{
    const mob=window.innerWidth<768;
    const W=window.innerWidth,H=window.innerHeight;
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(55,W/H,0.1,100);
    camera.position.z=5.5;
    const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
    renderer.setSize(W,H); renderer.setPixelRatio(Math.min(window.devicePixelRatio,mob?1.5:2));
    ref.current.appendChild(renderer.domElement);
    const mat1=new THREE.MeshBasicMaterial({color:0xC8E64A,wireframe:true,transparent:true,opacity:0.025});
    const mat2=new THREE.MeshBasicMaterial({color:0x444455,wireframe:true,transparent:true,opacity:0.012});
    const m1=new THREE.Mesh(new THREE.IcosahedronGeometry(2.2,1),mat1);
    const m2=new THREE.Mesh(new THREE.IcosahedronGeometry(1.3,1),mat2);
    scene.add(m1,m2);
    const mkTex=(c)=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(0.4,c.replace(',1)',',0.3)'));g.addColorStop(1,c.replace(',1)',',0)'));x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv);};
    const mkPts=(n,col,sz,op,rMin,rSpr)=>{const pos=new Float32Array(n*3);for(let i=0;i<n;i++){const r=rMin+Math.random()*rSpr;const th=Math.random()*Math.PI*2;const ph=Math.acos(2*Math.random()-1);pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);pos[i*3+2]=r*Math.cos(ph);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));return new THREE.Points(g,new THREE.PointsMaterial({map:mkTex(col),size:sz,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));};
    const p1=mkPts(mob?100:420,'rgba(200,230,74,1)',mob?0.04:0.022,0.32,2.5,5);
    const p2=mkPts(mob?25:100,'rgba(160,160,175,1)',mob?0.035:0.018,0.15,3,4);
    scene.add(p1,p2);
    let mx=0,my=0;
    const onM=(e)=>{mx=(e.clientX/W)*2-1;my=-(e.clientY/H)*2+1;};
    window.addEventListener('mousemove',onM);
    let id;
    const tick=()=>{ id=requestAnimationFrame(tick); const t=performance.now()*0.001; m1.rotation.x=t*0.025+my*0.12; m1.rotation.y=t*0.038+mx*0.12; m2.rotation.x=-t*0.02+my*0.07; m2.rotation.y=-t*0.03+mx*0.07; p1.rotation.y=t*0.007; p2.rotation.y=-t*0.005; renderer.render(scene,camera); };
    tick();
    const onR=()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); };
    window.addEventListener('resize',onR);
    return ()=>{ cancelAnimationFrame(id); window.removeEventListener('resize',onR); window.removeEventListener('mousemove',onM); if(ref.current&&renderer.domElement.parentNode===ref.current) ref.current.removeChild(renderer.domElement); renderer.dispose(); };
  },[]);
  return <div ref={ref} className="fixed inset-0" style={{zIndex:-10}}/>;
}

/* ─── PRELOADER ─── */
function Preloader({done}){
  const [n,setN]=useState(0);
  useEffect(()=>{
    const iv=setInterval(()=>{ setN(p=>{ if(p>=100){clearInterval(iv);setTimeout(done,250);return 100;} return p+2; }); },16);
    return ()=>clearInterval(iv);
  },[done]);
  return (
    <motion.div exit={{y:'-100%'}} transition={{duration:0.65,ease:[0.76,0,0.24,1]}} className="fixed inset-0 flex flex-col items-center justify-center" style={{background:'var(--ink)',zIndex:9999}}>
      <div style={{fontFamily:'Instrument Serif',fontSize:'clamp(70px,12vw,120px)',color:'var(--lime)',lineHeight:1}}>{n}</div>
      <div className="mt-4 w-28 h-[1px] overflow-hidden" style={{background:'var(--ink-border)'}}>
        <motion.div className="h-full" initial={{width:'0%'}} animate={{width:n+'%'}} style={{background:'var(--lime)'}}/>
      </div>
      <div className="mt-4" style={{fontFamily:'DM Mono',fontSize:'10px',letterSpacing:'0.2em',color:'var(--ink-muted)',textTransform:'uppercase'}}>Andrady</div>
    </motion.div>
  );
}

/* ─── NAVBAR ─── */
function Nav({refs}){
  const [sc,setSc]=useState(false);
  const [mo,setMo]=useState(false);
  useEffect(()=>{const fn=()=>setSc(window.scrollY>40);window.addEventListener('scroll',fn);return ()=>window.removeEventListener('scroll',fn);},[]);
  const go=useCallback((r)=>{r.current.scrollIntoView({behavior:'smooth'});setMo(false);},[]);
  const links=[
    {l:'Systems',r:refs.solution},
    {l:'How It Works',r:refs.process},
    {l:'Results',r:refs.proof},
    {l:'Pricing',r:refs.investment},
  ];
  return (
    <motion.nav initial={{opacity:0,y:-16}} animate={{opacity:1,y:0}} transition={{duration:0.5,delay:1.4}} className="fixed w-full" style={{zIndex:50,background:sc?'rgba(8,8,9,0.92)':'transparent',backdropFilter:sc?'blur(20px)':'none',borderBottom:sc?'1px solid var(--ink-border)':'none',padding:sc?'10px 0':'20px 0',transition:'all 0.35s'}}>
      <div className="max-w-5xl mx-auto px-6 flex items-center justify-between">
        <button onClick={()=>go(refs.hero)} data-h style={{fontFamily:'Instrument Serif',fontSize:'19px',color:'#E2E2E8',background:'none',border:'none',padding:0}}>Andrady</button>
        <div className="hidden md:flex items-center gap-1">
          {links.map(lk=>(
            <button key={lk.l} onClick={()=>go(lk.r)} data-h className="px-4 py-2 text-[13px]" style={{color:'var(--ink-muted)',background:'none',border:'none',transition:'color 0.2s'}} onMouseEnter={e=>e.currentTarget.style.color='var(--lime)'} onMouseLeave={e=>e.currentTarget.style.color='var(--ink-muted)'}>{lk.l}</button>
          ))}
          <button onClick={()=>go(refs.cta)} data-h className="btn-primary ml-2" style={{padding:'9px 20px',fontSize:'12px'}}>Book System Audit</button>
        </div>
        <button onClick={()=>setMo(!mo)} data-h className="md:hidden flex flex-col items-center justify-center gap-1.5 w-10 h-10" style={{background:'none',border:'none'}}>
          <motion.span animate={mo?{rotate:45,y:6}:{rotate:0,y:0}} className="block w-5 h-[1.5px] origin-center" style={{background:'var(--lime)'}}/>
          <motion.span animate={mo?{opacity:0}:{opacity:1}} className="block w-5 h-[1.5px]" style={{background:'var(--lime)'}}/>
          <motion.span animate={mo?{rotate:-45,y:-6}:{rotate:0,y:0}} className="block w-5 h-[1.5px] origin-center" style={{background:'var(--lime)'}}/>
        </button>
      </div>
      <AnimatePresence>
        {mo&&(
          <motion.div initial={{opacity:0,height:0}} animate={{opacity:1,height:'auto'}} exit={{opacity:0,height:0}} transition={{duration:0.22}} className="md:hidden overflow-hidden" style={{background:'rgba(8,8,9,0.97)',backdropFilter:'blur(20px)',borderTop:'1px solid var(--ink-border)'}}>
            <div className="px-6 py-5 space-y-1">
              {links.map((lk,i)=>(<motion.button key={lk.l} initial={{opacity:0,x:-10}} animate={{opacity:1,x:0}} transition={{delay:i*0.04}} onClick={()=>go(lk.r)} className="block w-full text-left py-3 text-base" style={{color:'var(--ink-muted)',background:'none',border:'none'}}>{lk.l}</motion.button>))}
              <button onClick={()=>go(refs.cta)} className="btn-primary w-full mt-3" style={{fontSize:'13px'}}>Book System Audit</button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </motion.nav>
  );
}

/* ─── ANIMATED WORKFLOW PREVIEW ─── */
function WorkflowPreview(){
  const [step,setStep]=useState(0);
  const flows=[
    ['Lead Captured','→','CRM Entry','→','Auto-Tagged','→','Follow-up Queued'],
    ['Client Books','→','Intake Sent','→','Portal Created','→','Team Notified'],
    ['Project Closes','→','Invoice Generated','→','Payment Tracked','→','Dashboard Updated'],
  ];
  const metrics=[
    {label:'Active Clients',value:'48',change:'+3'},
    {label:'Pipeline Value',value:'$218K',change:'↑12%'},
    {label:'Tasks Automated',value:'142',change:'this week'},
    {label:'Avg Onboard',value:'1.8hr',change:'was 3 days'},
  ];
  useEffect(()=>{
    const iv=setInterval(()=>setStep(s=>(s+1)%3),3200);
    return ()=>clearInterval(iv);
  },[]);
  return (

/* ─── 13. FINAL CTA ─── */
function FinalCTA({sectionRef}){
  const [form,setForm]=useState({name:'',email:'',biz:'',msg:''});
  const [submitting,setSubmitting]=useState(false);
  const [status,setStatus]=useState(null);
  const timerRef=useRef(null);
  const ch=(e)=>setForm({...form,[e.target.name]:e.target.value});
  const clearStatus=()=>{ if(timerRef.current) clearTimeout(timerRef.current); timerRef.current=setTimeout(()=>setStatus(null),6000); };
  const submit=async(e)=>{
    e.preventDefault();
    if(!form.name.trim()||!form.email.trim()||!form.msg.trim()){setStatus({t:'error',m:'Please fill in all required fields.'});clearStatus();return;}
    setSubmitting(true);setStatus(null);
    try{
      const res=await fetch('https://rsttirosnsfaortzugld.functions.supabase.co/submit-brief',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:form.name.trim(),email:form.email.trim(),message:`Business: ${form.biz}\n\n${form.msg.trim()}`})
      });
      if(res.ok){setStatus({t:'ok',m:"Received. We'll send your system scope within 24 hours."});setForm({name:'',email:'',biz:'',msg:''});}
      else setStatus({t:'error',m:'Something went wrong. Try again or WhatsApp us directly.'});
    }catch{setStatus({t:'error',m:'Something went wrong. Try again or WhatsApp us directly.'});}
    finally{setSubmitting(false);clearStatus();}
  };
  return (
    <section ref={sectionRef} id="cta-section" className="py-20 md:py-28 relative">
      <div className="absolute w-96 h-96 rounded-full" style={{background:'rgba(200,230,74,0.01)',filter:'blur(110px)',right:'25%',bottom:0,zIndex:-1}}/>
      <div className="max-w-lg mx-auto px-6">
        <div className="text-center mb-10">
          <R><span className="label block mb-4">Get Started</span></R>
          <R d={0.08}>
            <h2 className="display mb-4" style={{fontSize:'clamp(32px,5vw,56px)',color:'#E2E2E8'}}>
              Tell us how you operate.<br />We'll design what<br /><em style={{color:'var(--lime)',fontStyle:'italic'}}>you need built.</em>
            </h2>
          </R>
          <R d={0.13}>
            <p className="text-[14px] leading-relaxed mb-2" style={{color:'var(--ink-muted)'}}>
              Describe your current tools and where the operational friction is. We'll respond within 24 hours with a specific breakdown of what we'd architect and what it would cost.
            </p>
          </R>
          <R d={0.16}>
            <p className="text-[11px]" style={{color:'var(--ink-subtle)',fontFamily:'DM Mono',letterSpacing:'0.05em'}}>No sales call required · No commitment · No generic pitch</p>
          </R>
        </div>
        <R d={0.2}>
          <form onSubmit={submit} className="space-y-3 text-left">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input name="name" value={form.name} onChange={ch} placeholder="Your name *" required className="field"/>
              <input name="email" type="email" value={form.email} onChange={ch} placeholder="your@email.com *" required className="field"/>
            </div>
            <input name="biz" value={form.biz} onChange={ch} placeholder="What type of agency or business do you run?" className="field"/>
            <textarea name="msg" rows={4} value={form.msg} onChange={ch} required placeholder="What tools are you using now, and what's the biggest operational problem you need solved? *" className="field" style={{resize:'none'}}/>
            <motion.button type="submit" disabled={submitting} whileHover={{scale:submitting?1:1.02}} whileTap={{scale:submitting?1:0.97}} data-h className="btn-primary glow-btn w-full" style={{opacity:submitting?0.5:1,fontSize:'15px',padding:'17px'}}>
              {submitting?'Sending...':'Get my system architecture →'}
            </motion.button>
            {status&&(
              <div className="status-msg" style={{background:status.t==='ok'?'rgba(200,230,74,0.05)':'rgba(255,72,72,0.04)',color:status.t==='ok'?'var(--lime)':'rgba(255,100,100,0.65)',border:status.t==='ok'?'1px solid rgba(200,230,74,0.12)':'1px solid rgba(255,72,72,0.1)'}}>
                {status.m}
              </div>
            )}
          </form>
        </R>
        <R d={0.3} className="mt-8">
          <div className="grid grid-cols-3 gap-3 text-center">
            {['Response in 24hrs','Free scope included','Zero commitment'].map((t,i)=>(
              <div key={i} style={{padding:'10px 8px',borderRadius:'10px',background:'rgba(200,230,74,0.02)',border:'1px solid rgba(200,230,74,0.06)'}}>
                <p className="text-[10px]" style={{fontFamily:'DM Mono',color:'rgba(200,230,74,0.35)',letterSpacing:'0.04em',lineHeight:1.4}}>{t}</p>
              </div>
            ))}
          </div>
        </R>
      </div>
    </section>
  );
}

/* ─── APP ─── */
function App(){
  const [loading,setLoading]=useState(true);
  const done=useCallback(()=>setLoading(false),[]);
  const hero=useRef(null);
  const problem=useRef(null);
  const solution=useRef(null);
  const proof=useRef(null);
  const process=useRef(null);
  const investment=useRef(null);
  const cta=useRef(null);
  const refs={hero,problem,solution,proof,process,investment,cta};
  return (
    <div style={{background:'var(--ink)',color:'#E2E2E8',minHeight:'100vh'}}>
      <AnimatePresence>{loading&&<Preloader done={done}/>}</AnimatePresence>
      <Cursor/>
      <ProgressBar/>
      <Nav refs={refs}/>
      <Hero refs={refs}/>
      <Marquee text="AI WORKFLOWS · CRM · CLIENT PORTAL · AUTOMATION · OPERATIONS DASHBOARD · ONBOARDING · INTELLIGENCE"/>
      <InfraSection/>
      <PainPoints sectionRef={problem}/>
      <Systems sectionRef={solution}/>
      <WhatItReplaces/>
      <BeforeAfter/>
      <Outcomes/>
      <Proof sectionRef={proof}/>
      <Process sectionRef={process}/>
      <Investment sectionRef={investment}/>
      <WhoThisIsFor/>
      <FAQ/>
      <FinalCTA sectionRef={cta}/>
      <Footer/>
      <WA/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
