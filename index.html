<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrady — Custom Business Operating Systems</title>
  <meta name="description" content="Andrady builds custom software systems for agencies and service businesses — replacing scattered tools and manual admin with one connected platform that runs your operations automatically.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0A0A0B',
            'ink-card': '#0F0F12',
            'ink-border': '#1A1A1F',
            'ink-muted': '#55555F',
            'ink-subtle': '#333339',
            lime: '#C8E64A',
            'lime-dim': '#A8C43A',
          },
          fontFamily: {
            display: ['"Instrument Serif"', 'serif'],
            sans: ['"Syne"', 'sans-serif'],
            mono: ['"DM Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --lime: #C8E64A;
      --lime-dim: #A8C43A;
      --ink: #0A0A0B;
      --ink-card: #0F0F12;
      --ink-border: #1A1A1F;
      --ink-muted: #55555F;
      --ink-subtle: #333339;
    }

    *, *::before, *::after { box-sizing: border-box; cursor: none; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--ink); color: #E2E2E8; font-family: 'Syne', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 99px; }
    ::selection { background: rgba(200,230,74,0.15); color: #fff; }

    .grid-bg {
      background-image: linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    .display { font-family: 'Instrument Serif', serif; line-height: 1.02; letter-spacing: -0.015em; }
    .label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); }

    .card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 18px; padding: 28px; transition: border-color 0.4s, box-shadow 0.4s; }
    .card:hover { border-color: rgba(200,230,74,0.12); box-shadow: 0 0 35px rgba(200,230,74,0.03); }

    .card-accent { background: var(--ink-card); border: 1px solid rgba(200,230,74,0.1); border-radius: 18px; padding: 28px; position: relative; overflow: hidden; transition: border-color 0.4s; }
    .card-accent::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,230,74,0.16), transparent); }
    .card-accent:hover { border-color: rgba(200,230,74,0.22); }

    .pill { display: inline-flex; align-items: center; padding: 5px 14px; border-radius: 999px; background: rgba(200,230,74,0.06); border: 1px solid rgba(200,230,74,0.1); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lime); }

    .field { width: 100%; padding: 14px 18px; background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 12px; color: #E2E2E8; font-family: 'Syne', sans-serif; font-size: 14px; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
    .field:focus { border-color: rgba(200,230,74,0.35); box-shadow: 0 0 0 2px rgba(200,230,74,0.05); }
    .field::placeholder { color: var(--ink-muted); }

    .btn-primary { background: var(--lime); color: var(--ink); font-family: 'Syne', sans-serif; font-weight: 700; padding: 15px 34px; border-radius: 999px; font-size: 14px; letter-spacing: 0.005em; border: none; transition: background 0.25s, box-shadow 0.25s, transform 0.2s; box-shadow: 0 0 25px rgba(200,230,74,0.18); }
    .btn-primary:hover { background: var(--lime-dim); box-shadow: 0 0 40px rgba(200,230,74,0.3); transform: translateY(-1px); }

    .btn-secondary { background: transparent; color: #E2E2E8; font-family: 'Syne', sans-serif; font-weight: 500; padding: 15px 34px; border-radius: 999px; font-size: 14px; border: 1px solid var(--ink-border); transition: border-color 0.25s, color 0.25s, transform 0.2s; }
    .btn-secondary:hover { border-color: rgba(200,230,74,0.25); color: var(--lime); transform: translateY(-1px); }

    .glow-btn { box-shadow: 0 0 25px rgba(200,230,74,0.2), 0 2px 20px rgba(200,230,74,0.08); }

    .x-icon { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,80,80,0.06); border: 1px solid rgba(255,80,80,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .check-icon { width: 20px; height: 20px; border-radius: 50%; background: rgba(200,230,74,0.06); border: 1px solid rgba(200,230,74,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .marquee-track { display: inline-flex; animation: scroll 35s linear infinite; white-space: nowrap; }
    .marquee-track-rev { animation-direction: reverse; animation-duration: 42s; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    .step-num { font-family: 'Instrument Serif', serif; font-size: 100px; line-height: 1; color: rgba(200,230,74,0.04); position: absolute; top: -15px; right: 18px; pointer-events: none; user-select: none; }

    .metric-box { background: rgba(200,230,74,0.03); border: 1px solid rgba(200,230,74,0.07); border-radius: 12px; padding: 18px 22px; }

    .before-tag { display: inline-flex; padding: 4px 10px; border-radius: 6px; background: rgba(255,80,80,0.05); border: 1px solid rgba(255,80,80,0.08); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,80,80,0.45); }
    .after-tag { display: inline-flex; padding: 4px 10px; border-radius: 6px; background: rgba(200,230,74,0.06); border: 1px solid rgba(200,230,74,0.1); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lime); }

    .qualify-for { padding: 5px 12px; border-radius: 8px; background: rgba(200,230,74,0.04); border: 1px solid rgba(200,230,74,0.08); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: rgba(200,230,74,0.6); }
    .qualify-not { padding: 5px 12px; border-radius: 8px; background: rgba(255,80,80,0.03); border: 1px solid rgba(255,80,80,0.06); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: rgba(255,80,80,0.35); }

    .replace-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; background: var(--ink-card); border: 1px solid var(--ink-border); transition: border-color 0.3s; }
    .replace-row:hover { border-color: rgba(200,230,74,0.1); }
    .replace-tool { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink-muted); text-decoration: line-through; text-decoration-color: rgba(255,80,80,0.25); min-width: 140px; }
    .replace-feature { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--lime); }

    .sys-num { font-family: 'Instrument Serif', serif; font-size: 24px; color: rgba(200,230,74,0.12); line-height: 1; flex-shrink: 0; width: 36px; }

    /* NEW: Pain point ticker */
    .pain-ticker { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; background: rgba(255,80,80,0.04); border: 1px solid rgba(255,80,80,0.08); }

    /* NEW: Tool chaos grid */
    .tool-bubble { display: inline-flex; align-items: center; padding: 6px 13px; border-radius: 999px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em; border: 1px solid var(--ink-border); color: var(--ink-muted); background: var(--ink-card); transition: all 0.3s; }
    .tool-bubble:hover { border-color: rgba(255,80,80,0.18); color: rgba(255,80,80,0.45); }

    /* NEW: System module card */
    .module-card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 14px; padding: 20px 22px; transition: border-color 0.3s, transform 0.3s; }
    .module-card:hover { border-color: rgba(200,230,74,0.15); transform: translateY(-2px); }

    /* NEW: Stat highlight */
    .stat-pill { display: inline-flex; flex-direction: column; align-items: center; padding: 14px 22px; border-radius: 14px; background: rgba(200,230,74,0.04); border: 1px solid rgba(200,230,74,0.08); }

    /* NEW: Process connector line */
    .process-line { position: absolute; top: 50%; right: -20px; width: 40px; height: 1px; background: linear-gradient(90deg, rgba(200,230,74,0.15), transparent); display: none; }
    @media (min-width: 768px) { .process-line { display: block; } }

    .status-msg { font-family: 'DM Mono', monospace; font-size: 12px; padding: 11px 16px; border-radius: 99px; text-align: center; margin-top: 14px; }

    /* FAQ accordion */
    .faq-item { border-bottom: 1px solid var(--ink-border); }
    .faq-item:last-child { border-bottom: none; }

    /* Floating screenshot card */
    .ss-card { border-radius: 14px; overflow: hidden; border: 1px solid rgba(200,230,74,0.08); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

    @media (hover: none) { * { cursor: auto !important; } .cc, .cr { display: none !important; } a, button, input, textarea, select { cursor: auto !important; } }

    @media (max-width: 640px) {
      .sm-full { width: 100% !important; }
      .ba-grid { flex-direction: column !important; gap: 0.75rem !important; }
      .ba-grid .ba-arrow { transform: rotate(90deg); }
      .replace-tool { min-width: 100px; font-size: 11px; }
      .replace-feature { font-size: 11px; }
    }
  </style>
</head>
<body class="grid-bg">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const { motion, AnimatePresence } = window.Motion;

/* ─── CURSOR ─── */
function Cursor() {
  const dot = useRef(null);
  const ring = useRef(null);
  useEffect(() => {
    let mx = 0, my = 0, rx = 0, ry = 0;
    const onMove = (e) => {
      mx = e.clientX; my = e.clientY;
      if (dot.current) dot.current.style.transform = `translate(${mx - 3}px, ${my - 3}px)`;
      const t = e.target.closest('a, button, input, textarea, select, [data-h]');
      if (ring.current) {
        const s = t ? '50px' : '34px'; const o = t ? -25 : -17;
        ring.current.style.width = s; ring.current.style.height = s;
        ring.current.style.left = o + 'px'; ring.current.style.top = o + 'px';
        ring.current.style.borderColor = t ? 'var(--lime)' : 'rgba(200,230,74,0.22)';
        ring.current.style.opacity = t ? '0.9' : '0.5';
      }
    };
    const loop = () => { rx += (mx - rx) * 0.11; ry += (my - ry) * 0.11; if (ring.current) ring.current.style.transform = `translate(${rx}px, ${ry}px)`; requestAnimationFrame(loop); };
    window.addEventListener('mousemove', onMove); loop();
    return () => window.removeEventListener('mousemove', onMove);
  }, []);
  return (
    <>
      <div ref={dot} className="cc fixed w-[6px] h-[6px] rounded-full pointer-events-none" style={{ background: 'var(--lime)', mixBlendMode: 'difference', zIndex: 10000 }} />
      <div ref={ring} className="cr fixed rounded-full pointer-events-none" style={{ width: '34px', height: '34px', border: '1px solid rgba(200,230,74,0.22)', left: 0, top: 0, transition: 'width 0.2s, height 0.2s, left 0.2s, top 0.2s, border-color 0.2s, opacity 0.2s', zIndex: 10000 }} />
    </>
  );
}

/* ─── PROGRESS BAR ─── */
function ProgressBar() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const fn = () => { const t = document.documentElement.scrollHeight - window.innerHeight; setP(t > 0 ? (window.scrollY / t) * 100 : 0); };
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return <div className="fixed top-0 left-0 h-[2px]" style={{ width: p + '%', background: 'var(--lime)', zIndex: 9998 }} />;
}

/* ─── REVEAL ─── */
function R({ children, d = 0, className = '', y = 26 }) {
  return (
    <motion.div initial={{ opacity: 0, y }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true, margin: '-30px' }} transition={{ duration: 0.65, delay: d, ease: [0.22, 0.61, 0.36, 1] }} className={className}>
      {children}
    </motion.div>
  );
}

/* ─── THREE.JS BACKGROUND ─── */
function ThreeBG() {
  const ref = useRef(null);
  useEffect(() => {
    const mob = window.innerWidth < 768;
    const W = window.innerWidth, H = window.innerHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 100);
    camera.position.z = 5.5;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(W, H); renderer.setPixelRatio(Math.min(window.devicePixelRatio, mob ? 1.5 : 2));
    ref.current.appendChild(renderer.domElement);
    const mat1 = new THREE.MeshBasicMaterial({ color: 0xC8E64A, wireframe: true, transparent: true, opacity: 0.03 });
    const mat2 = new THREE.MeshBasicMaterial({ color: 0x888888, wireframe: true, transparent: true, opacity: 0.015 });
    const m1 = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2, 1), mat1);
    const m2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.3, 1), mat2);
    scene.add(m1, m2);
    const mkTex = (c) => { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const x = cv.getContext('2d'); const g = x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0, c); g.addColorStop(0.4, c.replace(',1)', ',0.3)')); g.addColorStop(1, c.replace(',1)', ',0)')); x.fillStyle = g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(cv); };
    const mkPts = (n, col, sz, op, rMin, rSpr) => { const pos = new Float32Array(n*3); for (let i = 0; i < n; i++) { const r = rMin + Math.random()*rSpr; const th = Math.random()*Math.PI*2; const ph = Math.acos(2*Math.random()-1); pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph); } const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3)); return new THREE.Points(g, new THREE.PointsMaterial({ map: mkTex(col), size: sz, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true })); };
    const p1 = mkPts(mob?120:500, 'rgba(200,230,74,1)', mob?0.04:0.025, 0.35, 2.5, 5);
    const p2 = mkPts(mob?30:120, 'rgba(180,180,190,1)', mob?0.035:0.02, 0.18, 3, 4);
    scene.add(p1, p2);
    let mx = 0, my = 0;
    const onM = (e) => { mx = (e.clientX/W)*2-1; my = -(e.clientY/H)*2+1; };
    window.addEventListener('mousemove', onM);
    let id;
    const tick = () => { id = requestAnimationFrame(tick); const t = performance.now()*0.001; m1.rotation.x=t*0.03+my*0.15; m1.rotation.y=t*0.045+mx*0.15; m2.rotation.x=-t*0.025+my*0.08; m2.rotation.y=-t*0.035+mx*0.08; p1.rotation.y=t*0.008; p2.rotation.y=-t*0.005; renderer.render(scene, camera); };
    tick();
    const onR = () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
    window.addEventListener('resize', onR);
    return () => { cancelAnimationFrame(id); window.removeEventListener('resize', onR); window.removeEventListener('mousemove', onM); if (ref.current && renderer.domElement.parentNode === ref.current) ref.current.removeChild(renderer.domElement); renderer.dispose(); };
  }, []);
  return <div ref={ref} className="fixed inset-0" style={{ zIndex: -10 }} />;
}

/* ─── PRELOADER ─── */
function Preloader({ done }) {
  const [n, setN] = useState(0);
  useEffect(() => {
    const iv = setInterval(() => { setN(p => { if (p >= 100) { clearInterval(iv); setTimeout(done, 300); return 100; } return p + 2; }); }, 16);
    return () => clearInterval(iv);
  }, [done]);
  return (
    <motion.div exit={{ y: '-100%' }} transition={{ duration: 0.7, ease: [0.76,0,0.24,1] }} className="fixed inset-0 flex flex-col items-center justify-center" style={{ background: 'var(--ink)', zIndex: 9999 }}>
      <div style={{ fontFamily: 'Instrument Serif', fontSize: 'clamp(70px,13vw,130px)', color: 'var(--lime)', lineHeight: 1 }}>{n}</div>
      <div className="mt-4 w-32 h-[1px] overflow-hidden" style={{ background: 'var(--ink-border)' }}>
        <motion.div className="h-full" initial={{ width: '0%' }} animate={{ width: n + '%' }} style={{ background: 'var(--lime)' }} />
      </div>
    </motion.div>
  );
}

/* ─── NAVBAR ─── */
function Nav({ refs }) {
  const [sc, setSc] = useState(false);
  const [mo, setMo] = useState(false);
  useEffect(() => { const fn = () => setSc(window.scrollY > 40); window.addEventListener('scroll', fn); return () => window.removeEventListener('scroll', fn); }, []);
  const go = useCallback((r) => { r.current.scrollIntoView({ behavior: 'smooth' }); setMo(false); }, []);
  const links = [
    { l: 'What We Build', r: refs.solution },
    { l: 'How It Works', r: refs.process },
    { l: 'Results', r: refs.proof },
    { l: 'Pricing', r: refs.investment },
  ];
  return (
    <motion.nav initial={{ opacity: 0, y: -18 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.5, delay: 1.4 }} className="fixed w-full" style={{ zIndex: 50, background: sc ? 'rgba(10,10,11,0.9)' : 'transparent', backdropFilter: sc ? 'blur(18px)' : 'none', borderBottom: sc ? '1px solid var(--ink-border)' : 'none', padding: sc ? '11px 0' : '20px 0', transition: 'all 0.35s' }}>
      <div className="max-w-5xl mx-auto px-6 flex items-center justify-between">
        <button onClick={() => go(refs.hero)} data-h style={{ fontFamily: 'Instrument Serif', fontSize: '20px', color: '#E2E2E8', background: 'none', border: 'none', padding: 0 }}>Andrady</button>
        <div className="hidden md:flex items-center gap-1">
          {links.map(lk => (
            <button key={lk.l} onClick={() => go(lk.r)} data-h className="px-4 py-2 text-[13px]" style={{ color: 'var(--ink-muted)', background: 'none', border: 'none', transition: 'color 0.25s' }} onMouseEnter={e => e.currentTarget.style.color = 'var(--lime)'} onMouseLeave={e => e.currentTarget.style.color = 'var(--ink-muted)'}>{lk.l}</button>
          ))}
          <button onClick={() => go(refs.cta)} data-h className="btn-primary ml-2" style={{ padding: '9px 22px', fontSize: '12px' }}>Get a Free Scope</button>
        </div>
        <button onClick={() => setMo(!mo)} data-h className="md:hidden flex flex-col items-center justify-center gap-1.5 w-10 h-10" style={{ background: 'none', border: 'none' }}>
          <motion.span animate={mo ? { rotate: 45, y: 6 } : { rotate: 0, y: 0 }} className="block w-5 h-[1.5px] origin-center" style={{ background: 'var(--lime)' }} />
          <motion.span animate={mo ? { opacity: 0 } : { opacity: 1 }} className="block w-5 h-[1.5px]" style={{ background: 'var(--lime)' }} />
          <motion.span animate={mo ? { rotate: -45, y: -6 } : { rotate: 0, y: 0 }} className="block w-5 h-[1.5px] origin-center" style={{ background: 'var(--lime)' }} />
        </button>
      </div>
      <AnimatePresence>
        {mo && (
          <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} transition={{ duration: 0.25 }} className="md:hidden overflow-hidden" style={{ background: 'rgba(10,10,11,0.97)', backdropFilter: 'blur(18px)', borderTop: '1px solid var(--ink-border)' }}>
            <div className="px-6 py-5 space-y-1">
              {links.map((lk, i) => (<motion.button key={lk.l} initial={{ opacity: 0, x: -12 }} animate={{ opacity: 1, x: 0 }} transition={{ delay: i * 0.04 }} onClick={() => go(lk.r)} className="block w-full text-left py-3 text-base" style={{ color: 'var(--ink-muted)', background: 'none', border: 'none' }}>{lk.l}</motion.button>))}
              <button onClick={() => go(refs.cta)} className="btn-primary w-full mt-3" style={{ fontSize: '13px' }}>Get a Free Scope</button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </motion.nav>
  );
}

/* ─── 1. HERO — "The software that runs your business" ─── */
function Hero({ refs }) {
  const go = (k) => refs[k].current.scrollIntoView({ behavior: 'smooth' });
  const tools = ['Spreadsheets', 'Calendly', 'Trello', 'Notion', 'Mailchimp', 'Gmail threads', 'Typeform', 'Stripe links', 'WhatsApp', 'Airtable'];
  return (
    <section ref={refs.hero} className="relative min-h-screen flex items-center justify-center overflow-hidden" style={{ paddingTop: '70px' }}>
      <ThreeBG />
      <div className="absolute inset-0 pointer-events-none" style={{ background: 'linear-gradient(to bottom, var(--ink) 0%, transparent 12%, transparent 85%, var(--ink) 100%)' }} />
      <div className="relative z-10 text-center px-6 max-w-3xl w-full">

        {/* ★ NEW: Credibility tag */}
        <R d={1.6}>
          <div className="pill mx-auto mb-7 inline-block">Custom Business Operating Systems</div>
        </R>

        {/* ★ IMPROVED HERO HEADLINE — ultra-clear in 5 seconds */}
        <div className="overflow-hidden mb-5">
          <motion.h1

    { n: '01', t: 'Scoping Call', sub: '45 minutes. Free.', d: 'We map your current workflows, tools, and pain points. You walk away with a clear picture of what we\'d build — even if you don\'t move forward.', icon: '🔍' },
    { n: '02', t: 'System Design', sub: '2–3 days.', d: 'We design your platform architecture and send you a detailed scope document: every module, every workflow, every automation — and the exact cost.', icon: '🗺️' },
    { n: '03', t: 'Build & Deploy', sub: '7–21 days depending on scope.', d: 'We build it. You review it. We refine it. Then we deploy it and train you and your team on how to use it.', icon: '⚡' },
    { n: '04', t: 'Ongoing Support', sub: 'Optional.', d: 'After launch, you can retain us for system management, updates, and expansion as your business grows.', icon: '🛡️' },
  ];
  return (
    <section ref={sectionRef} className="py-20 md:py-28">
      <div className="max-w-5xl mx-auto px-6">
        <div className="text-center mb-12">
          <R><span className="label block mb-4">How It Works</span></R>
          <R d={0.08}>
            <h2 className="display mb-3" style={{ fontSize: 'clamp(30px,4.5vw,50px)', color: '#E2E2E8' }}>
              From scoping call to live system<br />in <em style={{ color: 'var(--lime)', fontStyle: 'italic' }}>under 3 weeks.</em>
            </h2>
          </R>
          <R d={0.12}>
            <p className="text-[14px] max-w-sm mx-auto" style={{ color: 'var(--ink-muted)' }}>No agency handoffs. No 6-month timelines. We scope, build, and deploy — directly.</p>
          </R>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-9">
          {steps.map((s, i) => (
            <R key={i} d={i * 0.08}>
              <div className="card h-full text-center py-8 px-5 relative overflow-hidden">
                <div className="step-num" style={{ fontSize: '70px', opacity: 0.035 }}>{s.n}</div>
                <div className="relative z-10">
                  <div className="text-2xl mb-3">{s.icon}</div>
                  <span className="label block mb-3">{s.n}</span>
                  <p className="text-[15px] mb-1" style={{ color: '#E2E2E8', fontWeight: 700 }}>{s.t}</p>
                  <p className="text-[11px] mb-3" style={{ fontFamily: 'DM Mono', color: 'var(--lime)', letterSpacing: '0.04em' }}>{s.sub}</p>
                  <p className="text-[12px] leading-relaxed" style={{ color: 'var(--ink-muted)' }}>{s.d}</p>
                </div>
              </div>
            </R>
          ))}
        </div>
        <R d={0.3} className="text-center">
          <button onClick={() => document.getElementById('cta-section').scrollIntoView({ behavior: 'smooth' })} className="btn-primary glow-btn" data-h>Start with a free scoping call</button>
        </R>
      </div>
    </section>
  );
}

/* ─── 9. INVESTMENT ─── */

        <div className="text-center mb-12">
          <R><span className="label block mb-4">Investment</span></R>
          <R d={0.08}>
            <h2 className="display mb-4" style={{ fontSize: 'clamp(30px,4.5vw,50px)', color: '#E2E2E8' }}>
              Priced for the value it delivers,<br />not the hours it takes.
            </h2>
          </R>
          <R d={0.12}>
            <p className="text-[14px] max-w-md mx-auto" style={{ color: 'var(--ink-muted)' }}>

          </R>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">

            { tier: 'Core System', range: '$5,000 – $8,000', desc: 'CRM, client portal, booking, and automated onboarding. Ideal for solo operators and small teams.', items: ['CRM + Client Management', 'Booking & Scheduling', 'Client Portal', 'Onboarding Automation', 'Operations Dashboard'] },
            { tier: 'Full Platform', range: '$8,000 – $15,000', desc: 'Everything in Core, plus website, advanced automations, custom workflows, and integrations.', items: ['Everything in Core', 'Connected Website', 'Advanced Automation', 'Custom Workflow Engine', 'Billing Integration'], featured: true },
            { tier: 'Enterprise System', range: '$15,000+', desc: 'Multi-team systems, complex integrations, white-label portals, and custom-built internal tools.', items: ['Multi-team Access', 'Custom Integrations', 'White-label Portals', 'Advanced Reporting', 'Dedicated Support'] },
          ].map((tier, i) => (
            <R key={i} d={i * 0.08}>
              <div className={tier.featured ? 'card-accent' : 'card'} style={{ height: '100%' }}>
                {tier.featured && <div className="pill mb-3 inline-block" style={{ fontSize: '9px' }}>Most Popular</div>}
                <p className="text-[13px] mb-1" style={{ color: '#E2E2E8', fontWeight: 700 }}>{tier.tier}</p>
                <p className="display mb-3" style={{ fontSize: '22px', color: 'var(--lime)' }}>{tier.range}</p>
                <p className="text-[12px] leading-relaxed mb-4" style={{ color: 'var(--ink-muted)' }}>{tier.desc}</p>
                <div className="space-y-2">
                  {tier.items.map((item, j) => (
                    <div key={j} className="flex items-center gap-2">
                      <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1.5 4l2 2 3-3.5" stroke="var(--lime)" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" /></svg>
                      <span className="text-[12px]" style={{ color: 'var(--ink-muted)' }}>{item}</span>

                </div>
              </div>
            </R>
          ))}
        </div>
        <R d={0.3} className="text-center">
          <p className="text-[13px] mb-5" style={{ color: 'var(--ink-muted)' }}>Every system is scoped individually. You'll receive a detailed breakdown before anything is agreed.</p>
          <button onClick={() => document.getElementById('cta-section').scrollIntoView({ behavior: 'smooth' })} className="btn-primary glow-btn" data-h>Get a custom quote — it's free</button>

/* ─── 10. WHO THIS IS FOR ─── */
function WhoThisIsFor() {
  return (
    <section className="py-16 md:py-20" style={{ borderTop: '1px solid var(--ink-border)', borderBottom: '1px solid var(--ink-border)' }}>

          <R d={0.14}><div className="qualify-for">Service businesses with established processes that need to be systematised and automated</div></R>

/* ─── 11. FAQ ─── */
function FAQ() {
  const [open, setOpen] = useState(null);
  const qs = [
    { q: 'What exactly do you build?', a: 'Custom software platforms tailored to your business. Typically this includes a CRM, client portal, booking system, onboarding automation, operations dashboard, and website — all connected and sharing the same data. Every system is scoped to your exact needs.' },
    { q: 'How is this different from Notion, HubSpot, or a website builder?', a: 'Those are generic tools you adapt yourself. We build a system specifically for how your business works — your clients, your workflows, your processes. Nothing is off-the-shelf. And because it\'s all one system, every component talks to every other component.' },
    { q: 'How long does it take?', a: 'Core systems are typically live in 7 days. Full platforms take 14–21 days depending on scope. We agree on a timeline before we start — no open-ended projects.' },
    { q: 'What do I need to have in place before we start?', a: 'Just a clear sense of your current process and where the friction is. We handle the rest in the scoping session. Most clients are surprised by how quickly we can map their operation and turn it into a build plan.' },
    { q: 'What happens after the system is built?', a: 'You own it. We train you and your team. If you want ongoing management, updates, or expansion, that\'s available — but you\'re never locked in. The system is yours.' },
    { q: 'Do you offer payment plans?', a: 'Yes. We typically structure larger projects as 50% upfront and 50% on delivery. For ongoing retainer work, monthly billing applies. We can discuss what works for you.' },
  ];
  return (
    <section className="py-20 md:py-28">
      <div className="max-w-2xl mx-auto px-6">
        <div className="text-center mb-10">
          <R><span className="label block mb-4">Common Questions</span></R>
          <R d={0.08}><h2 className="display" style={{ fontSize: 'clamp(28px,4vw,44px)', color: '#E2E2E8' }}>Before you reach out.</h2></R>
        </div>
        <div className="card" style={{ padding: '0' }}>
          {qs.map((faq, i) => (
            <R key={i} d={i * 0.04}>
              <div className="faq-item">
                <button onClick={() => setOpen(open === i ? null : i)} className="w-full text-left flex items-center justify-between gap-4" style={{ padding: '18px 24px', background: 'none', border: 'none', color: '#E2E2E8' }} data-h>
                  <span className="text-[14px]" style={{ fontWeight: 600 }}>{faq.q}</span>
                  <motion.span animate={{ rotate: open === i ? 45 : 0 }} transition={{ duration: 0.2 }} style={{ flexShrink: 0, color: 'var(--lime)', fontSize: '18px', lineHeight: 1 }}>+</motion.span>
                </button>
                <AnimatePresence>
                  {open === i && (
                    <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} transition={{ duration: 0.25 }} style={{ overflow: 'hidden' }}>
                      <p className="text-[13px] leading-relaxed" style={{ color: 'var(--ink-muted)', padding: '0 24px 20px' }}>{faq.a}</p>
                    </motion.div>
                  )}
                </AnimatePresence>
              </div>
            </R>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ─── 12. FINAL CTA — specificity + no-risk framing ─── */
function FinalCTA({ sectionRef }) {
  const [form, setForm] = useState({ name: '', email: '', biz: '', msg: '' });
  const [submitting, setSubmitting] = useState(false);
  const [status, setStatus] = useState(null);
  const timerRef = useRef(null);
  const ch = (e) => setForm({ ...form, [e.target.name]: e.target.value });
  const clearStatus = () => { if (timerRef.current) clearTimeout(timerRef.current); timerRef.current = setTimeout(() => setStatus(null), 6000); };
  const submit = async (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.email.trim() || !form.msg.trim()) { setStatus({ t: 'error', m: 'Please fill in all required fields.' }); clearStatus(); return; }
    setSubmitting(true); setStatus(null);
    try {
      const res = await fetch('https://rsttirosnsfaortzugld.functions.supabase.co/submit-brief', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: form.name.trim(), email: form.email.trim(), message: `Business: ${form.biz}\n\n${form.msg.trim()}` })
      });
      if (res.ok) { setStatus({ t: 'ok', m: "Received. We'll send your custom scope breakdown within 24 hours." }); setForm({ name: '', email: '', biz: '', msg: '' }); }
      else setStatus({ t: 'error', m: 'Something went wrong. Please try again or WhatsApp us directly.' });
    } catch { setStatus({ t: 'error', m: 'Something went wrong. Please try again or WhatsApp us directly.' }); }
    finally { setSubmitting(false); clearStatus(); }
  };
  return (
    <section ref={sectionRef} id="cta-section" className="py-20 md:py-28 relative">
      <div className="absolute w-80 h-80 rounded-full" style={{ background: 'rgba(200,230,74,0.012)', filter: 'blur(100px)', right: '30%', bottom: 0, zIndex: -1 }} />
      <div className="max-w-lg mx-auto px-6">
        <div className="text-center mb-10">
          <R><span className="label block mb-4">Get Started</span></R>
          <R d={0.08}>
            <h2 className="display mb-4" style={{ fontSize: 'clamp(34px,5.5vw,58px)', color: '#E2E2E8' }}>
              Tell us how you work.<br />We'll tell you what<br /><em style={{ color: 'var(--lime)', fontStyle: 'italic' }}>we'd build.</em>
            </h2>
          </R>
          <R d={0.13}>
            <p className="text-[14px] leading-relaxed mb-2" style={{ color: 'var(--ink-muted)' }}>
              Describe your current tools and where the friction is. We'll respond within 24 hours with a specific breakdown of what we'd build and what it would cost.
            </p>
          </R>
          <R d={0.16}>
            <p className="text-[11px]" style={{ color: 'var(--ink-subtle)', fontFamily: 'DM Mono', letterSpacing: '0.05em' }}>No sales call required · No commitment · No generic pitch</p>
          </R>
        </div>
        <R d={0.2}>
          <form onSubmit={submit} className="space-y-3 text-left">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <input name="name" value={form.name} onChange={ch} placeholder="Your name *" required className="field" />
              <input name="email" type="email" value={form.email} onChange={ch} placeholder="your@email.com *" required className="field" />
            </div>
            <input name="biz" value={form.biz} onChange={ch} placeholder="What type of business do you run?" className="field" />
            <textarea name="msg" rows={4} value={form.msg} onChange={ch} required placeholder="What tools are you using now, and what's the biggest operational problem you want to fix? *" className="field" style={{ resize: 'none' }} />
            <motion.button type="submit" disabled={submitting} whileHover={{ scale: submitting ? 1 : 1.02 }} whileTap={{ scale: submitting ? 1 : 0.97 }} data-h className="btn-primary glow-btn w-full" style={{ opacity: submitting ? 0.5 : 1, fontSize: '15px', padding: '17px' }}>
              {submitting ? 'Sending...' : 'Get my custom system breakdown →'}
            </motion.button>
            {status && (
              <div className={`status-msg ${status.t === 'ok' ? '' : ''}`} style={{ background: status.t === 'ok' ? 'rgba(200,230,74,0.06)' : 'rgba(255,80,80,0.05)', color: status.t === 'ok' ? 'var(--lime)' : 'rgba(255,100,100,0.7)', border: status.t === 'ok' ? '1px solid rgba(200,230,74,0.15)' : '1px solid rgba(255,80,80,0.12)' }}>
                {status.m}
              </div>
            )}
          </form>
        </R>
        {/* ★ NEW: Trust signals below form */}
        <R d={0.3} className="mt-8">
          <div className="grid grid-cols-3 gap-3 text-center">
            {['Response within 24hrs', 'Free scope included', 'No commitment needed'].map((t, i) => (
              <div key={i} style={{ padding: '10px 8px', borderRadius: '10px', background: 'rgba(200,230,74,0.02)', border: '1px solid rgba(200,230,74,0.06)' }}>
                <p className="text-[11px]" style={{ fontFamily: 'DM Mono', color: 'rgba(200,230,74,0.4)', letterSpacing: '0.04em', lineHeight: 1.4 }}>{t}</p>
              </div>
            ))}
          </div>
        </R>
      </div>
    </section>
  );
}

      <div className="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-3">

      </div>

}

    </motion.a>
  );
}

/* ─── APP ─── */
function App() {
  const [loading, setLoading] = useState(true);
  const done = useCallback(() => setLoading(false), []);
  const hero = useRef(null);
  const problem = useRef(null);
  const solution = useRef(null);
  const proof = useRef(null);
  const process = useRef(null);
  const investment = useRef(null);
  const cta = useRef(null);
  const refs = { hero, problem, solution, proof, process, investment, cta };
  return (
    <div style={{ background: 'var(--ink)', color: '#E2E2E8', minHeight: '100vh' }}>
      <AnimatePresence>{loading && <Preloader done={done} />}</AnimatePresence>
      <Cursor />
      <ProgressBar />
      <Nav refs={refs} />
      <Hero refs={refs} />
      <Marquee text="CRM · CLIENT PORTAL · BOOKING · AUTOMATION · OPERATIONS DASHBOARD · ONBOARDING" />
      <PainPoints sectionRef={problem} />
      <TheSystem sectionRef={solution} />
      <WhatItReplaces />
      <BeforeAfter />
      <Outcomes />
      <Proof sectionRef={proof} />
      <Process sectionRef={process} />
      <Investment sectionRef={investment} />
      <WhoThisIsFor />
      <FAQ />
      <FinalCTA sectionRef={cta} />
      <Footer />
      <WA />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
