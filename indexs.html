<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrady — Agency Operating Systems</title>
  <meta name="description" content="Andrady builds custom operating systems for growing agencies. Replace operational chaos, manual admin, and disconnected tools with one connected platform built around how your agency works.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#07070A',
            'ink-card': '#0C0C10',
            'ink-border': '#16161E',
            'ink-muted': '#4E4E5A',
            'ink-subtle': '#2A2A34',
            lime: '#C8E64A',
            'lime-dim': '#A8C43A',
          },
          fontFamily: {
            display: ['"Instrument Serif"', 'serif'],
            sans: ['"Syne"', 'sans-serif'],
            mono: ['"DM Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --lime: #C8E64A;
      --lime-dim: #A8C43A;
      --ink: #07070A;
      --ink-card: #0C0C10;
      --ink-border: #16161E;
      --ink-muted: #4E4E5A;
      --ink-subtle: #2A2A34;
      --red: rgba(255,72,72,0.65);
    }

    *, *::before, *::after { box-sizing: border-box; cursor: none; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--ink); color: #E0E0E8; font-family: 'Syne', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: var(--ink); }
    ::-webkit-scrollbar-thumb { background: var(--lime); border-radius: 99px; }
    ::selection { background: rgba(200,230,74,0.1); color: #fff; }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255,255,255,0.011) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.011) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .display { font-family: 'Instrument Serif', serif; line-height: 1.03; letter-spacing: -0.018em; }
    .label { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-muted); }

    .card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 16px; padding: 26px; transition: border-color 0.4s, box-shadow 0.4s; }
    .card:hover { border-color: rgba(200,230,74,0.08); box-shadow: 0 0 48px rgba(200,230,74,0.02); }
    .card-accent { background: var(--ink-card); border: 1px solid rgba(200,230,74,0.14); border-radius: 16px; padding: 26px; position: relative; overflow: hidden; }
    .card-accent::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(200,230,74,0.22), transparent); }

    .pill { display: inline-flex; align-items: center; padding: 5px 14px; border-radius: 999px; background: rgba(200,230,74,0.04); border: 1px solid rgba(200,230,74,0.1); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--lime); }

    .field { width: 100%; padding: 14px 18px; background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 10px; color: #E0E0E8; font-family: 'Syne', sans-serif; font-size: 14px; outline: none; transition: border-color 0.3s, box-shadow 0.3s; }
    .field:focus { border-color: rgba(200,230,74,0.25); box-shadow: 0 0 0 3px rgba(200,230,74,0.03); }
    .field::placeholder { color: var(--ink-muted); }

    .btn-primary { background: var(--lime); color: var(--ink); font-family: 'Syne', sans-serif; font-weight: 700; padding: 15px 34px; border-radius: 999px; font-size: 14px; letter-spacing: 0.01em; border: none; transition: background 0.25s, box-shadow 0.25s, transform 0.2s; box-shadow: 0 0 32px rgba(200,230,74,0.14); cursor: none; }
    .btn-primary:hover { background: var(--lime-dim); box-shadow: 0 0 48px rgba(200,230,74,0.26); transform: translateY(-1px); }
    .btn-secondary { background: transparent; color: #E0E0E8; font-family: 'Syne', sans-serif; font-weight: 500; padding: 15px 34px; border-radius: 999px; font-size: 14px; border: 1px solid var(--ink-border); transition: border-color 0.25s, color 0.25s, transform 0.2s; cursor: none; }
    .btn-secondary:hover { border-color: rgba(200,230,74,0.2); color: var(--lime); transform: translateY(-1px); }
    .glow-btn { box-shadow: 0 0 32px rgba(200,230,74,0.16), 0 2px 20px rgba(200,230,74,0.06); }

    .check-icon { width: 20px; height: 20px; border-radius: 50%; background: rgba(200,230,74,0.04); border: 1px solid rgba(200,230,74,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .x-icon { width: 20px; height: 20px; border-radius: 50%; background: rgba(255,72,72,0.04); border: 1px solid rgba(255,72,72,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .marquee-track { display: inline-flex; animation: scroll 44s linear infinite; white-space: nowrap; }
    .marquee-rev { animation-direction: reverse; animation-duration: 55s; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); animation: pulse 2s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,230,74,0.4); } 50% { box-shadow: 0 0 0 5px rgba(200,230,74,0); } }

    .flow-node { padding: 7px 14px; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.04em; border: 1px solid var(--ink-border); background: var(--ink-card); color: rgba(224,224,232,0.55); white-space: nowrap; }
    .flow-node-active { border-color: rgba(200,230,74,0.22); color: var(--lime); background: rgba(200,230,74,0.03); }

    .metric-chip { background: rgba(200,230,74,0.03); border: 1px solid rgba(200,230,74,0.07); border-radius: 8px; padding: 9px 13px; }
    .stat-card { background: rgba(200,230,74,0.02); border: 1px solid rgba(200,230,74,0.06); border-radius: 14px; padding: 22px 18px; text-align: center; }

    .faq-item { border-bottom: 1px solid var(--ink-border); }
    .faq-item:last-child { border-bottom: none; }

    .pain-row { display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px; border-radius: 12px; background: rgba(255,72,72,0.02); border: 1px solid rgba(255,72,72,0.06); transition: border-color 0.3s; }
    .pain-row:hover { border-color: rgba(255,72,72,0.1); }

    .before-tag { display: inline-flex; padding: 3px 9px; border-radius: 6px; background: rgba(255,72,72,0.04); border: 1px solid rgba(255,72,72,0.08); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,72,72,0.4); }
    .after-tag { display: inline-flex; padding: 3px 9px; border-radius: 6px; background: rgba(200,230,74,0.04); border: 1px solid rgba(200,230,74,0.1); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--lime); }

    .status-msg { font-family: 'DM Mono', monospace; font-size: 12px; padding: 11px 16px; border-radius: 99px; text-align: center; margin-top: 12px; }

    .qualify-for { padding: 9px 14px; border-radius: 10px; background: rgba(200,230,74,0.02); border: 1px solid rgba(200,230,74,0.06); font-size: 13px; color: rgba(200,230,74,0.5); }
    .qualify-not { padding: 9px 14px; border-radius: 10px; background: rgba(255,72,72,0.02); border: 1px solid rgba(255,72,72,0.05); font-size: 13px; color: rgba(255,72,72,0.28); }

    .sys-card { background: var(--ink-card); border: 1px solid var(--ink-border); border-radius: 14px; padding: 22px 22px; transition: border-color 0.35s, transform 0.3s; }
    .sys-card:hover { border-color: rgba(200,230,74,0.12); transform: translateY(-2px); }

    .replace-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; background: var(--ink-card); border: 1px solid var(--ink-border); transition: border-color 0.3s; }
    .replace-row:hover { border-color: rgba(200,230,74,0.09); }

    @media (hover: none) { * { cursor: auto !important; } .cc, .cr { display: none !important; } }
    @media (max-width: 640px) { .sm-full { width: 100% !important; } }
  </style>
</head>
<body class="grid-bg">
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const { motion, AnimatePresence } = window.Motion;

/* ─── CURSOR ─── */
function Cursor() {
  const dot = useRef(null);
  const ring = useRef(null);
  useEffect(() => {
    let mx=0,my=0,rx=0,ry=0;
    const onMove=(e)=>{
      mx=e.clientX; my=e.clientY;
      if(dot.current) dot.current.style.transform=`translate(${mx-3}px,${my-3}px)`;
      const t=e.target.closest('a,button,input,textarea,select,[data-h]');
      if(ring.current){
        const s=t?'46px':'30px'; const o=t?-23:-15;
        ring.current.style.width=s; ring.current.style.height=s;
        ring.current.style.left=o+'px'; ring.current.style.top=o+'px';
        ring.current.style.borderColor=t?'var(--lime)':'rgba(200,230,74,0.16)';
        ring.current.style.opacity=t?'0.8':'0.4';
      }
    };
    const loop=()=>{ rx+=(mx-rx)*0.1; ry+=(my-ry)*0.1; if(ring.current) ring.current.style.transform=`translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); };
    window.addEventListener('mousemove',onMove); loop();
    return ()=>window.removeEventListener('mousemove',onMove);
  },[]);
  return (<>
    <div ref={dot} className="cc fixed w-[6px] h-[6px] rounded-full pointer-events-none" style={{background:'var(--lime)',mixBlendMode:'difference',zIndex:10000}}/>
    <div ref={ring} className="cr fixed rounded-full pointer-events-none" style={{width:'30px',height:'30px',border:'1px solid rgba(200,230,74,0.16)',left:0,top:0,transition:'width 0.22s,height 0.22s,left 0.22s,top 0.22s,border-color 0.2s,opacity 0.2s',zIndex:10000}}/>
  </>);
}

/* ─── PROGRESS BAR ─── */
function ProgressBar(){
  const [p,setP]=useState(0);
  useEffect(()=>{
    const fn=()=>{const t=document.documentElement.scrollHeight-window.innerHeight; setP(t>0?(window.scrollY/t)*100:0);};
    window.addEventListener('scroll',fn); return ()=>window.removeEventListener('scroll',fn);
  },[]);
  return <div className="fixed top-0 left-0 h-[2px]" style={{width:p+'%',background:'var(--lime)',zIndex:9998}}/>;
}

/* ─── REVEAL ─── */
function R({children,d=0,className='',y=20}){
  return (
    <motion.div initial={{opacity:0,y}} whileInView={{opacity:1,y:0}} viewport={{once:true,margin:'-30px'}} transition={{duration:0.58,delay:d,ease:[0.22,0.61,0.36,1]}} className={className}>
      {children}
    </motion.div>
  );
}

/* ─── THREE BG ─── */
function ThreeBG(){
  const ref=useRef(null);
  useEffect(()=>{
    const mob=window.innerWidth<768;
    const W=window.innerWidth,H=window.innerHeight;
    const scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(55,W/H,0.1,100);
    camera.position.z=5.5;
    const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
    renderer.setSize(W,H); renderer.setPixelRatio(Math.min(window.devicePixelRatio,mob?1.5:2));
    ref.current.appendChild(renderer.domElement);
    const mat1=new THREE.MeshBasicMaterial({color:0xC8E64A,wireframe:true,transparent:true,opacity:0.022});
    const mat2=new THREE.MeshBasicMaterial({color:0x333344,wireframe:true,transparent:true,opacity:0.01});
    const m1=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1,1),mat1);
    const m2=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,1),mat2);
    scene.add(m1,m2);
    const mkTex=(c)=>{const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,c);g.addColorStop(0.4,c.replace(',1)',',0.3)'));g.addColorStop(1,c.replace(',1)',',0)'));x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(cv);};
    const mkPts=(n,col,sz,op,rMin,rSpr)=>{const pos=new Float32Array(n*3);for(let i=0;i<n;i++){const r=rMin+Math.random()*rSpr;const th=Math.random()*Math.PI*2;const ph=Math.acos(2*Math.random()-1);pos[i*3]=r*Math.sin(ph)*Math.cos(th);pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);pos[i*3+2]=r*Math.cos(ph);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));return new THREE.Points(g,new THREE.PointsMaterial({map:mkTex(col),size:sz,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));};
    const p1=mkPts(mob?90:400,'rgba(200,230,74,1)',mob?0.04:0.022,0.28,2.5,5);
    const p2=mkPts(mob?22:90,'rgba(150,150,168,1)',mob?0.035:0.018,0.12,3,4);
    scene.add(p1,p2);
    let mx=0,my=0;
    const onM=(e)=>{mx=(e.clientX/W)*2-1;my=-(e.clientY/H)*2+1;};
    window.addEventListener('mousemove',onM);
    let id;
    const tick=()=>{ id=requestAnimationFrame(tick); const t=performance.now()*0.001; m1.rotation.x=t*0.022+my*0.1; m1.rotation.y=t*0.035+mx*0.1; m2.rotation.x=-t*0.018+my*0.06; m2.rotation.y=-t*0.028+mx*0.06; p1.rotation.y=t*0.006; p2.rotation.y=-t*0.005; renderer.render(scene,camera); };
    tick();
    const onR=()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); };
    window.addEventListener('resize',onR);
    return ()=>{ cancelAnimationFrame(id); window.removeEventListener('resize',onR); window.removeEventListener('mousemove',onM); if(ref.current&&renderer.domElement.parentNode===ref.current) ref.current.removeChild(renderer.domElement); renderer.dispose(); };
  },[]);
  return <div ref={ref} className="fixed inset-0" style={{zIndex:-10}}/>;
}

/* ─── PRELOADER ─── */
function Preloader({done}){
  const [n,setN]=useState(0);
  useEffect(()=>{
    const iv=setInterval(()=>{ setN(p=>{ if(p>=100){clearInterval(iv);setTimeout(done,200);return 100;} return p+2; }); },16);
    return ()=>clearInterval(iv);
  },[done]);
  return (
    <motion.div exit={{y:'-100%'}} transition={{duration:0.6,ease:[0.76,0,0.24,1]}} className="fixed inset-0 flex flex-col items-center justify-center" style={{background:'var(--ink)',zIndex:9999}}>
      <div style={{fontFamily:'Instrument Serif',fontSize:'clamp(70px,12vw,120px)',color:'var(--lime)',lineHeight:1}}>{n}</div>
      <div className="mt-4 w-28 h-[1px] overflow-hidden" style={{background:'var(--ink-border)'}}>
        <motion.div className="h-full" initial={{width:'0%'}} animate={{width:n+'%'}} style={{background:'var(--lime)'}}/>
      </div>
      <div className="mt-4" style={{fontFamily:'DM Mono',fontSize:'10px',letterSpacing:'0.22em',color:'var(--ink-muted)',textTransform:'uppercase'}}>Andrady</div>
    </motion.div>
  );
}

/* ─── NAVBAR ─── */
function Nav({refs}){
  const [sc,setSc]=useState(false);
  const [mo,setMo]=useState(false);
  useEffect(()=>{const fn=()=>setSc(window.scrollY>50);window.addEventListener('scroll',fn);return ()=>window.removeEventListener('scroll',fn);},[]);
  const go=useCallback((r)=>{r.current.scrollIntoView({behavior:'smooth'});setMo(false);},[]);
  const links=[
    {l:'The Problem',r:refs.problem},
    {l:'The System',r:refs.solution},
    {l:'Process',r:refs.process},
    {l:'Pricing',r:refs.investment},
  ];
  return (
    <motion.nav initial={{opacity:0,y:-16}} animate={{opacity:1,y:0}} transition={{duration:0.5,delay:1.4}} className="fixed w-full" style={{zIndex:50,background:sc?'rgba(7,7,10,0.93)':'transparent',backdropFilter:sc?'blur(20px)':'none',borderBottom:sc?'1px solid var(--ink-border)':'none',padding:sc?'10px 0':'20px 0',transition:'all 0.35s'}}>
      <div className="max-w-5xl mx-auto px-6 flex items-center justify-between">
        <button onClick={()=>go(refs.hero)} data-h style={{fontFamily:'Instrument Serif',fontSize:'19px',color:'#E0E0E8',background:'none',border:'none',padding:0}}>Andrady</button>
        <div className="hidden md:flex items-center gap-1">
          {links.map(lk=>(
            <button key={lk.l} onClick={()=>go(lk.r)} data-h className="px-4 py-2 text-[13px]" style={{color:'var(--ink-muted)',background:'none',border:'none',transition:'color 0.2s'}} onMouseEnter={e=>e.currentTarget.style.color='#E0E0E8'} onMouseLeave={e=>e.currentTarget.style.color='var(--ink-muted)'}>{lk.l}</button>
          ))}
          <button onClick={()=>go(refs.cta)} data-h className="btn-primary ml-3" style={{padding:'9px 20px',fontSize:'12px'}}>Free Operations Audit</button>
        </div>
        <button onClick={()=>setMo(!mo)} data-h className="md:hidden flex flex-col items-center justify-center gap-1.5 w-10 h-10" style={{background:'none',border:'none'}}>
          <motion.span animate={mo?{rotate:45,y:6}:{rotate:0,y:0}} className="block w-5 h-[1.5px] origin-center" style={{background:'var(--lime)'}}/>
          <motion.span animate={mo?{opacity:0}:{opacity:1}} className="block w-5 h-[1.5px]" style={{background:'var(--lime)'}}/>
          <motion.span animate={mo?{rotate:-45,y:-6}:{rotate:0,y:0}} className="block w-5 h-[1.5px] origin-center" style={{background:'var(--lime)'}}/>
        </button>
      </div>
      <AnimatePresence>
        {mo&&(
          <motion.div initial={{opacity:0,height:0}} animate={{opacity:1,height:'auto'}} exit={{opacity:0,height:0}} transition={{duration:0.22}} className="md:hidden overflow-hidden" style={{background:'rgba(7,7,10,0.97)',backdropFilter:'blur(20px)',borderTop:'1px solid var(--ink-border)'}}>
            <div className="px-6 py-5 space-y-1">
              {links.map((lk,i)=>(<motion.button key={lk.l} initial={{opacity:0,x:-10}} animate={{opacity:1,x:0}} transition={{delay:i*0.04}} onClick={()=>go(lk.r)} className="block w-full text-left py-3 text-base" style={{color:'var(--ink-muted)',background:'none',border:'none'}}>{lk.l}</motion.button>))}
              <button onClick={()=>go(refs.cta)} className="btn-primary w-full mt-3" style={{fontSize:'13px'}}>Free Operations Audit</button>
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </motion.nav>
  );
}

/* ─── LIVE DASHBOARD PREVIEW ─── */
function DashboardPreview(){
  const [step,setStep]=useState(0);
  const [tick,setTick]=useState(0);
  const flows=[
    {label:'Lead capture', nodes:['Enquiry received','→','CRM updated','→','Lead tagged','→','Follow-up queued']},
    {label:'Client onboarding', nodes:['Booking confirmed','→','Intake sent','→','Portal created','→','Team notified']},
    {label:'Project closure', nodes:['Work delivered','→','Invoice generated','→','Payment tracked','→','Dashboard synced']},
  ];
  const metrics=[
    {label:'Active Clients',value:'48',delta:'+3 this month'},
    {label:'Pipeline',value:'$218K',delta:'↑12% vs last'},
    {label:'Admin Hours',value:'2.1',delta:'was 14/week'},
    {label:'Avg Onboard',value:'1.8hr',delta:'was 3 days'},
  ];
  useEffect(()=>{
    const iv=setInterval(()=>{ setStep(s=>(s+1)%3); setTick(t=>t+1); },3400);
    return ()=>clearInterval(iv);
  },[]);
  return (
    <div className="relative w-full max-w-2xl mx-auto mt-10">
      <div className="absolute inset-0 rounded-2xl" style={{background:'radial-gradient(ellipse at 50% 0%,rgba(200,230,74,0.05) 0%,transparent 60%)',pointerEvents:'none'}}/>
      <div style={{background:'var(--ink-card)',border:'1px solid rgba(200,230,74,0.09)',borderRadius:'16px',overflow:'hidden'}}>
        {/* Window bar */}
        <div style={{padding:'10px 16px',borderBottom:'1px solid var(--ink-border)',display:'flex',alignItems:'center',gap:'7px'}}>
          <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'rgba(255,72,72,0.45)'}}/>
          <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'rgba(255,190,0,0.45)'}}/>
          <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'rgba(200,230,74,0.45)'}}/>
          <span style={{fontFamily:'DM Mono',fontSize:'10px',color:'var(--ink-muted)',letterSpacing:'0.08em',marginLeft:'8px'}}>andrady / operations</span>
          <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'5px',padding:'3px 10px',borderRadius:'999px',background:'rgba(200,230,74,0.03)',border:'1px solid rgba(200,230,74,0.08)'}}>
            <div className="status-dot" style={{width:'5px',height:'5px'}}/>
            <span style={{fontFamily:'DM Mono',fontSize:'9px',color:'rgba(200,230,74,0.5)',letterSpacing:'0.1em'}}>LIVE</span>
          </div>
        </div>
        {/* Metrics */}

function FinalCTA({sectionRef}){
  const [form,setForm]=useState({name:'',email:'',biz:'',msg:''});
  const [submitting,setSubmitting]=useState(false);
  const [status,setStatus]=useState(null);
  const timerRef=useRef(null);
  const ch=(e)=>setForm({...form,[e.target.name]:e.target.value});
  const clearStatus=()=>{ if(timerRef.current) clearTimeout(timerRef.current); timerRef.current=setTimeout(()=>setStatus(null),7000); };
  const submit=async(e)=>{
    e.preventDefault();
    if(!form.name.trim()||!form.email.trim()||!form.msg.trim()){setStatus({t:'error',m:'Please fill in all required fields.'});clearStatus();return;}
    setSubmitting(true);setStatus(null);
    try{
      const res=await fetch('https://rsttirosnsfaortzugld.functions.supabase.co/submit-brief',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:form.name.trim(),email:form.email.trim(),message:`Business: ${form.biz}\n\n${form.msg.trim()}`})
      });
      if(res.ok){setStatus({t:'ok',m:"Received. We'll be in touch within 24 hours with your audit details."});setForm({name:'',email:'',biz:'',msg:''});}
      else setStatus({t:'error',m:'Something went wrong. Try again or message us on WhatsApp.'});
    }catch{setStatus({t:'error',m:'Something went wrong. Try again or message us on WhatsApp.'});}
    finally{setSubmitting(false);clearStatus();}

function App(){
  const [loading,setLoading]=useState(true);
  const done=useCallback(()=>setLoading(false),[]);
  const hero=useRef(null);
  const problem=useRef(null);
  const solution=useRef(null);
  const proof=useRef(null);
  const process=useRef(null);
  const investment=useRef(null);

  const refs={hero,problem,solution,proof,process,investment,cta};
  return (
    <div style={{background:'var(--ink)',color:'#E0E0E8',minHeight:'100vh'}}>
      <AnimatePresence>{loading&&<Preloader done={done}/>}</AnimatePresence>
      <Cursor/>

      <Marquee text="ONBOARDING · DELIVERY · REPORTING · AUTOMATION · CLIENT PORTAL · CRM · WORKFLOWS · VISIBILITY"/>

      <CostOfChaos/>
      <Systems sectionRef={solution}/>
      <BeforeAfter/>
      <WhatChanges/>
      <ToolReplacement/>
      <Proof sectionRef={proof}/>
      <Process sectionRef={process}/>
      <Investment sectionRef={investment}/>
      <WhoFor/>
      <FAQ/>
      <FinalCTA sectionRef={cta}/>
      <Footer/>
      <WA/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
